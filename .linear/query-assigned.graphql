query ListAssigned {
  issues(
    filter: {
      assignee: { email: { eq: "adelingtoro@gmail.com" } }
      state: { type: { neq: "completed" } }
    }
    first: 50
  ) {
    nodes {
      identifier
      title
      state { name type }
      priority
      labels { nodes { name } }
      url
      updatedAt
    }
  }
}
