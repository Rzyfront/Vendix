<h1 class="sr-only">Actividad de tiendas</h1>
<div class="w-full">
  <!-- Stats (4 cards, sticky en móvil como el resto de módulos estándar) -->
  <div
    class="stats-container sticky top-0 z-20 bg-background md:static md:bg-transparent"
  >
    <app-stats
      title="Tiendas activas"
      [value]="stats().active_stores"
      [smallText]="stats().orders_total + ' pedidos en el rango'"
      iconName="store"
      iconBgColor="bg-green-100"
      iconColor="text-green-600"
      [loading]="isLoadingStats()"
    />
    <app-stats
      title="Actividad vs meta"
      [value]="stats().activity_pct_vs_meta_80 + '%'"
      smallText="Meta: 80% de tiendas activas"
      iconName="chart-line"
      iconBgColor="bg-blue-100"
      iconColor="text-blue-600"
      [loading]="isLoadingStats()"
    />
    <app-stats
      title="Horas promedio / día"
      [value]="formatScore(stats().avg_hours_per_day)"
      smallText="Horas con eventos por día"
      iconName="clock"
      iconBgColor="bg-purple-100"
      iconColor="text-purple-600"
      [loading]="isLoadingStats()"
    />
    <app-stats
      title="Sin actividad"
      [value]="stats().inactive_stores"
      smallText="Tiendas sin eventos en el rango"
      iconName="moon"
      iconBgColor="bg-amber-100"
      iconColor="text-amber-600"
      [loading]="isLoadingStats()"
    />
  </div>

  <!-- Ranking -->
  <app-card [responsive]="true" [padding]="false">
    <!-- Barra sticky: título + búsqueda + filtros -->
    <div
      class="sticky top-[99px] z-10 bg-background px-2 py-1.5 -mt-[5px]
             md:mt-0 md:static md:bg-transparent md:px-6 md:py-4 md:border-b md:border-border"
    >
      <div
        class="flex flex-col gap-2 md:flex-row md:justify-between md:items-center md:gap-4"
      >
        <h2
          class="text-[13px] font-bold text-gray-600 tracking-wide md:text-lg md:font-semibold md:text-text-primary leading-tight"
        >
          Ranking por actividad ({{ totalItems() }})
          <span
            class="block text-[11px] font-normal normal-case tracking-normal text-text-secondary md:text-xs"
          >
            {{ rangeLabel() }} · por score, mayor a menor
          </span>
        </h2>

        <div class="flex items-center gap-2 w-full md:w-auto">
          <app-inputsearch
            class="flex-1 md:w-56 shadow-[0_2px_8px_rgba(0,0,0,0.07)] md:shadow-none rounded-[10px]"
            size="sm"
            placeholder="Buscar tienda..."
            [debounceTime]="300"
            [ngModel]="searchTerm()"
            (searchChange)="onSearch($event)"
          />
          <app-inputsearch
            class="flex-1 md:w-56 shadow-[0_2px_8px_rgba(0,0,0,0.07)] md:shadow-none rounded-[10px]"
            size="sm"
            placeholder="ID organización..."
            title="Filtra por ID numérico de organización"
            [debounceTime]="400"
            [ngModel]="organizationInput()"
            (searchChange)="onOrganizationSearch($event)"
          />
          <app-options-dropdown
            class="shadow-[0_2px_8px_rgba(0,0,0,0.07)] md:shadow-none rounded-[10px]"
            [filters]="filterConfigs"
            [filterValues]="filterValues()"
            [actions]="dropdownActions"
            [isLoading]="isLoading()"
            (filterChange)="onFilterChange($event)"
            (clearAllFilters)="clearFilters()"
            (actionClick)="onActionClick($event)"
          />
        </div>
      </div>

    </div>

    <div class="px-2 pb-2 pt-3 md:p-4">
      @if (isLoading()) {
        <div class="p-4 md:p-6 text-center">
          <div
            class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary"
          ></div>
          <p class="mt-2 text-text-secondary">Cargando actividad...</p>
        </div>
      }

      @if (!isLoading() && rows().length === 0) {
        <app-empty-state
          icon="activity"
          [title]="getEmptyStateTitle()"
          [description]="getEmptyStateDescription()"
          [showActionButton]="false"
          [showRefreshButton]="true"
          [showClearFilters]="hasFilters()"
          (refreshClick)="onActionClick('refresh')"
          (clearFiltersClick)="clearFilters()"
        />
      }

      @if (!isLoading() && rows().length > 0) {
        <app-responsive-data-view
          [data]="rows()"
          [columns]="tableColumns"
          [cardConfig]="cardConfig"
          [actions]="tableActions"
          [loading]="isLoading()"
          [sortable]="true"
          [hoverable]="true"
          [striped]="true"
          emptyMessage="Sin actividad registrada"
          emptyIcon="activity"
          (sort)="onSort($event)"
          (rowClick)="openDetail($event)"
        />
        <div class="mt-4 flex justify-center">
          <app-pagination
            [currentPage]="filters().page"
            [totalPages]="totalPages()"
            [total]="totalItems()"
            [limit]="filters().limit"
            (pageChange)="onPageChange($event)"
          />
        </div>
      }
    </div>
  </app-card>

  @if (isDetailOpen()) {
    <app-store-activity-detail-modal
      [(isOpen)]="isDetailOpen"
      [store]="selectedStore()"
    />
  }
</div>
