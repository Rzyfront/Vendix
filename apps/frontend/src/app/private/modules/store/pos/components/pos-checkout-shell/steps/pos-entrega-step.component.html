<!-- Paso · Entrega — "Tipo de entrega" (Consumir / Para llevar / Enviar). -->
<div class="entrega-step">
  <div class="section-title">
    <app-icon
      name="package"
      [size]="18"
      class="section-title__icon"
    ></app-icon>
    <h3 class="section-title__text">Tipo de entrega</h3>
  </div>

  <div
    class="option-list"
    role="radiogroup"
    aria-label="Tipo de entrega"
    (keydown)="onKeyDown($event)"
  >
    <!-- Consumo en mesa (solo para restaurante) -->
    @if (isRestaurantMode()) {
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="choice() === 'mesa'"
        [attr.tabindex]="choice() === 'mesa' ? 0 : -1"
        class="option-row"
        [class.option-row--selected]="choice() === 'mesa'"
        (click)="onOptionClick('mesa')"
      >
        <span class="option-row__icon">
          <app-icon name="utensils" [size]="24"></app-icon>
        </span>
        <span class="option-row__body">
          <span class="option-row__title">Consumo en mesa</span>
          <span class="option-row__desc">Requiere abrir o asignar una mesa</span>
        </span>
        <span
          class="option-row__radio"
          [class.option-row__radio--checked]="choice() === 'mesa'"
          aria-hidden="true"
        ></span>
      </button>
    }

    <!-- Para llevar -->
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="choice() === 'llevar'"
      [attr.tabindex]="choice() === 'llevar' ? 0 : -1"
      class="option-row"
      [class.option-row--selected]="choice() === 'llevar'"
      (click)="onOptionClick('llevar')"
    >
      <span class="option-row__icon">
        <app-icon name="shopping-bag" [size]="24"></app-icon>
      </span>
      <span class="option-row__body">
        <span class="option-row__title">Para llevar</span>
        <span class="option-row__desc">Entrega directa en mostrador</span>
      </span>
      <span
        class="option-row__radio"
        [class.option-row__radio--checked]="choice() === 'llevar'"
        aria-hidden="true"
      ></span>
    </button>

    <!-- Enviar a domicilio -->
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="choice() === 'enviar'"
      [attr.tabindex]="choice() === 'enviar' ? 0 : -1"
      class="option-row"
      [class.option-row--selected]="choice() === 'enviar'"
      (click)="onOptionClick('enviar')"
    >
      <span class="option-row__icon">
        <app-icon name="truck" [size]="24"></app-icon>
      </span>
      <span class="option-row__body">
        <span class="option-row__title">Enviar a domicilio</span>
        <span class="option-row__desc">Requiere dirección y flete</span>
      </span>
      <span
        class="option-row__radio"
        [class.option-row__radio--checked]="choice() === 'enviar'"
        aria-hidden="true"
      ></span>
    </button>
  </div>

  @if (choice() === 'mesa') {
    <button
      type="button"
      class="choose-table-btn"
      (click)="openTablePicker.set(true)"
    >
      <app-icon name="grid" [size]="20"></app-icon>
      <span>Elegir mesa</span>
    </button>

    @if (hasSelectedTable()) {
      <div class="table-pill">
        <app-icon name="check" [size]="14"></app-icon>
        <span>{{ tablePillText() }}</span>
      </div>
    }
  }
</div>

<!-- Picker de mesa inline (selección pura QUI-535) -->
<app-pos-open-table-modal
  [isOpen]="openTablePicker()"
  (isOpenChange)="openTablePicker.set($event)"
  [customer]="cartState()?.customer ?? null"
  [selectOnly]="true"
  (tableSelected)="onTableSelected($event)"
></app-pos-open-table-modal>
