@if (loading()) {
  <div class="overview-stat-card stat-skeleton state-neutral" aria-busy="true">
    <div class="stat-content">
      <div class="stat-header">
        <div class="skeleton-pill"></div>
        <div class="skeleton-icon"></div>
      </div>
      <div class="skeleton-value"></div>
      <div class="stat-footer">
        <div class="skeleton-dot"></div>
        <div class="skeleton-pill-sm"></div>
      </div>
    </div>
  </div>
} @else {
  <div class="overview-stat-card" [class]="'state-' + state()" [attr.aria-label]="title()">
    <!-- Decorative top-right gradient accent -->
    <div class="stat-corner-bg" aria-hidden="true"></div>

    <div class="stat-content">
      <div class="stat-header">
        <h3 class="stat-title">{{ title() }}</h3>

        @if (trend() && growth() !== null && growth() !== undefined) {
          <div class="stat-trend-badge" [class]="'trend-' + trend()">
            <app-icon [name]="trendIcon()" [size]="12" />
            <span>{{ formattedGrowth() }}</span>
          </div>
        } @else if (icon()) {
          <div class="stat-icon-wrapper">
            @if (icon() === 'percent') {
              <span class="stat-percent-glyph">%</span>
            } @else {
              <app-icon [name]="icon()" [size]="18" />
            }
          </div>
        }
      </div>

      <div class="stat-value" [title]="formattedValue()">{{ formattedValue() }}</div>

      <div class="stat-footer">
        <span class="stat-indicator" aria-hidden="true"></span>
        <span class="stat-state-label">{{ stateLabel() }}</span>
      </div>
    </div>

    <!-- Bottom accent line -->
    <div class="stat-bottom-line" aria-hidden="true"></div>
  </div>
}
