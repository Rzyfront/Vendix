<!--
  Edición masiva de productos (QUI-567).

  `app-sticky-header` va en la RAÍZ del contenedor, sin padre con padding: si se
  anida dentro de un contenedor acolchado, `sticky top-0` se pega respecto a ese
  contenedor y el encabezado salta al hacer scroll. El padding vive en el bloque
  de contenido de abajo.
-->
<div class="w-full">
  <app-sticky-header
    title="Edición masiva de productos"
    subtitle="Selecciona productos, define los cambios y revísalos antes de aplicar"
    icon="layers"
    [actions]="headerActions()"
    [metadataContent]="headerMetadata()"
    (actionClicked)="onHeaderAction($event)"
  />

  <div class="flex flex-col gap-3 p-2 md:gap-4 md:p-4">
    @if (applyBlockedReason()) {
      <p
        class="flex items-start gap-1.5 rounded-lg border border-border bg-surface px-3 py-2 text-[11px] leading-tight text-text-secondary"
      >
        <app-icon name="info" [size]="13" class="mt-px shrink-0 text-primary" />
        {{ applyBlockedReason() }}. Los cambios solo se escriben desde el modal de
        confirmación, después de ver el impacto producto por producto.
      </p>
    }

    <!-- ═══ Dos paneles: resultados a la izquierda, stack a la derecha ═══════ -->
    <div class="grid grid-cols-1 items-start gap-3 lg:grid-cols-12 lg:gap-4">
      <div class="lg:col-span-7 xl:col-span-8">
        <app-bulk-selection-panel
          [products]="products()"
          [fetching]="fetching()"
          [pickingAll]="pickingAll()"
          [total]="totalItems()"
          [page]="page()"
          [limit]="limit"
          [totalPages]="totalPages()"
          [capped]="capped()"
          [cappedLimit]="cappedLimit"
          [(selectedIds)]="selectedIds"
          [filters]="selectionFilters()"
          (filtersChange)="onFiltersChanged($event)"
          (selectAllFiltered)="onSelectAllFiltered()"
          (pageChanged)="onPageChanged($event)"
          (refreshRequested)="onRefresh()"
        />
      </div>

      <div class="bulk-stack-column lg:col-span-5 xl:col-span-4">
        <app-bulk-selected-stack
          [entries]="selectedEntries()"
          [hydrating]="hydrating()"
          (removeRequested)="onRemoveFromStack($event)"
          (clearRequested)="onClearStack()"
        />
      </div>
    </div>

    <!-- ═══ Panel de cambios ════════════════════════════════════════════════ -->
    <app-bulk-changes-panel
      [groups]="changeGroups()"
      [form]="changesForm"
      [typeOptions]="typeOptions()"
      [uomOptions]="uomOptions()"
      [templateOptions]="templateOptions()"
      [selectionCount]="selectedCount()"
      [(activeFields)]="activeFields"
      (resetRequested)="onResetChanges()"
    />
  </div>

  <!--
    El modal se monta siempre y se gobierna con `modalOpen`. Su efecto interno
    dispara el dry-run al abrirse y borra el preview al cerrarse, así que reabrir
    nunca muestra el diff de una selección anterior.
  -->
  <app-bulk-confirm-modal
    [(modalOpen)]="modalOpen"
    [ids]="selectedIdList()"
    [changes]="changes()"
    [resolveName]="nameResolver()"
    (applied)="onApplied($event)"
  />
</div>
