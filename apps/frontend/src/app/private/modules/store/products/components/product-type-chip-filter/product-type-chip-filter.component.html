<div class="type-chip-filter" role="radiogroup" aria-label="Tipo de producto">
  @for (option of options; track option.value) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="value() === option.value"
      [attr.tabindex]="value() === option.value ? 0 : -1"
      class="type-chip-filter__option"
      [class.type-chip-filter__option--selected]="value() === option.value"
      (click)="select(option.value)"
      (keydown)="onKeydown($event)"
    >
      {{ option.label }}
    </button>
  }
</div>
