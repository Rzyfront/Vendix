<div class="general-settings min-h-screen">
  <!-- Navegación única de secciones: las pestañas del sticky header, en TODOS
       los breakpoints. El rail `app-scrollable-tabs` que vivía debajo sólo
       existía en móvil (`lg:hidden`) y hacía scroll a un ancla; en escritorio
       no había navegación de secciones. -->
  <app-sticky-header
    title="Configuración General"
    subtitle="Configura las preferencias administrativas y flujos de negocio"
    icon="settings"
    [badgeText]="store.badgeText()"
    [badgeColor]="store.badgeColor()"
    [badgePulse]="store.badgePulse()"
    [metadataContent]="store.metadataContent()"
    [actions]="store.headerActions()"
    [tabs]="tabs()"
    [activeTab]="activeTabId()"
    tabsAriaLabel="Secciones de configuración"
    (actionClicked)="onHeaderAction($event)"
    (tabChanged)="onTabChanged($event)">
  </app-sticky-header>

  <!-- El gate de carga vive acá, una sola vez para las seis páginas: los
       sub-formularios se montan con los settings ya cargados, igual que cuando
       las 13 secciones estaban apiladas detrás del mismo `@if`. -->
  <div class="settings-content">
    @if (store.isLoading()) {
      <div class="loading-card">
        <div class="loading-spinner"></div>
        <p class="loading-text">Cargando configuraciones...</p>
      </div>
    } @else {
      <router-outlet />
    }
  </div>
</div>
