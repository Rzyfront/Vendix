<div class="space-y-6 w-full max-w-[1600px] mx-auto py-4">
  <!-- Stats Cards -->
  @if (loading()) {
    <div class="stats-container sticky top-0 z-20 bg-background md:static md:bg-transparent">
      @for (i of [1, 2, 3, 4]; track i) {
        <div
          class="bg-surface border border-border rounded-xl p-4 animate-pulse"
        >
          <div class="h-4 bg-gray-200 rounded w-1/2 mb-2"></div>
          <div class="h-8 bg-gray-200 rounded w-3/4"></div>
        </div>
      }
    </div>
  } @else {
    <div
      class="stats-container sticky top-0 z-20 bg-background md:static md:bg-transparent"
    >
      <app-stats
        title="Ingresos Totales"
        [value]="summary()?.total_revenue | currency"
        [smallText]="getGrowthText(summary()?.revenue_growth)"
        iconName="dollar-sign"
        iconBgColor="bg-green-100"
        iconColor="text-green-600"
      ></app-stats>

      <app-stats
        title="Total Órdenes"
        [value]="summary()?.total_orders || 0"
        [smallText]="getGrowthText(summary()?.orders_growth)"
        iconName="shopping-cart"
        iconBgColor="bg-blue-100"
        iconColor="text-blue-600"
      ></app-stats>

      <app-stats
        title="Ticket Promedio"
        [value]="summary()?.average_order_value | currency"
        smallText="Valor promedio por orden"
        iconName="receipt"
        iconBgColor="bg-purple-100"
        iconColor="text-purple-600"
      ></app-stats>

      <app-stats
        title="Unidades Vendidas"
        [value]="summary()?.total_units_sold || 0"
        smallText="Total en el período"
        iconName="package"
        iconBgColor="bg-orange-100"
        iconColor="text-orange-600"
      ></app-stats>
    </div>
  }

    <app-card shadow="none" [padding]="false" overflow="hidden" [showHeader]="true">
    <div slot="header" class="results-header flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-2 min-w-0">
        <app-icon name="dollar-sign" [size]="20" class="shrink-0 text-[var(--color-primary)]"></app-icon>
        <span class="results-header__title text-base md:text-lg font-bold text-[var(--color-text-primary)] leading-tight whitespace-nowrap">Analíticas y Reportes de Ventas</span>
      </div>
      <div class="flex items-end gap-2 flex-wrap shrink-0">
      <vendix-date-range-filter
              [value]="dateRange()"
              (valueChange)="onDateRangeChange($event)"
            ></vendix-date-range-filter>
            <app-options-dropdown
              class="shadow-[0_2px_8px_rgba(0,0,0,0.07)] md:shadow-none rounded-[10px]"
              [filters]="[]"
              [actions]="dropdownActions()"
              [showActions]="true"
              triggerLabel="Acciones"
              triggerIcon="plus"
              (actionClick)="onActionsDropdownClick($event)"
            ></app-options-dropdown>
      </div>
    </div>
    <div class="p-4 space-y-6">


  <!-- Content Grid -->
  <div class="grid grid-cols-1 gap-6">
    <!-- Charts Row -->
    <!-- Revenue Trend Chart -->
    <app-card
      shadow="none"
      [padding]="false"
      overflow="hidden"
      [showHeader]="true"
    >
      <div slot="header" class="results-header flex flex-col">
        <span class="text-sm font-bold text-[var(--color-text-primary)]"
          >Tendencia de Ingresos</span
        >
        <span class="text-xs text-[var(--color-text-secondary)]"
          >Evolución de ingresos en el período</span
        >
      </div>
      <div class="p-4">
        @if (loadingTrends()) {
          <div class="h-64 flex items-center justify-center">
            <div
              class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"
            ></div>
          </div>
        } @else {
          @defer (on immediate) {
            <app-chart
              [options]="revenueChartOptions()"
              size="large"
              [showLegend]="false"
            ></app-chart>
          } @placeholder {
            <div
              class="h-64 bg-surface-secondary animate-pulse rounded-xl"
            ></div>
          }
        }
      </div>
    </app-card>
  </div>

  <!-- Quick Links -->
  <app-card shadow="none" [responsivePadding]="true" class="md:mt-4">
    <span class="text-sm font-bold text-[var(--color-text-primary)]"
      >Vistas de Ventas</span
    >
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">
      @for (view of salesViews; track view.key) {
        <app-analytics-card [view]="view"></app-analytics-card>
      }
    </div>
  </app-card>
    </div>
  </app-card>
</div>
