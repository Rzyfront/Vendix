<div class="space-y-6 w-full max-w-[1600px] mx-auto py-4">
  <!-- KPI cards -->
  <div class="stats-container sticky top-0 z-20 bg-background md:static md:bg-transparent">
    <app-stats
      title="Recaudado"
      [value]="(summary()?.total_collected ?? 0) | currency"
      [smallText]="growthText()"
      iconName="wallet"
      [iconBgColor]="growthBg()"
      [iconColor]="growthColor()"
      [loading]="loading() && !summary()"
    ></app-stats>

    <app-stats
      title="# Pagos"
      [value]="summary()?.payments_count ?? 0"
      [smallText]="(summary()?.collected_count ?? 0) + ' recaudados'"
      iconName="receipt"
      iconBgColor="bg-blue-100"
      iconColor="text-blue-600"
      [loading]="loading() && !summary()"
    ></app-stats>

    <app-stats
      title="Ticket Promedio"
      [value]="(summary()?.average_payment ?? 0) | currency"
      smallText="Promedio por pago recaudado"
      iconName="circle-dollar-sign"
      iconBgColor="bg-emerald-100"
      iconColor="text-emerald-600"
      [loading]="loading() && !summary()"
    ></app-stats>

    <app-stats
      title="Reembolsado"
      [value]="(summary()?.total_refunded ?? 0) | currency"
      [smallText]="'Neto recaudado: ' + (summary()?.net_collected ?? 0 | currency)"
      iconName="rotate-ccw"
      iconBgColor="bg-red-100"
      iconColor="text-red-600"
      [loading]="loading() && !summary()"
    ></app-stats>

    <app-stats
      title="Pendiente"
      [value]="(summary()?.pending_amount ?? 0) | currency"
      smallText="Pagos aún sin confirmar"
      iconName="clock"
      iconBgColor="bg-amber-100"
      iconColor="text-amber-600"
      [loading]="loading() && !summary()"
    ></app-stats>

    <app-stats
      title="Fallidos"
      [value]="summary()?.failed_count ?? 0"
      smallText="Pagos rechazados o fallidos"
      iconName="x-circle"
      iconBgColor="bg-gray-100"
      iconColor="text-gray-500"
      [loading]="loading() && !summary()"
    ></app-stats>
  </div>

  <!-- Header + filters -->
  <div
    class="flex items-center justify-between gap-3 sticky top-0 z-10 bg-surface px-4 py-3 border-b border-border rounded-lg mx-1 mb-4"
  >
    <div class="flex items-center gap-2.5 min-w-0">
      <div
        class="hidden md:flex w-10 h-10 rounded-lg bg-[var(--color-background)] items-center justify-center border border-[var(--color-border)] shadow-sm shrink-0"
      >
        <app-icon name="credit-card" class="text-[var(--color-primary)]"></app-icon>
      </div>
      <div class="min-w-0">
        <h1 class="text-base md:text-lg font-bold text-[var(--color-text-primary)] leading-tight truncate">
          Resumen de Pagos
        </h1>
        <p class="hidden sm:block text-xs text-[var(--color-text-secondary)] font-medium truncate">
          Recaudo, tendencia y estados de pago del periodo
        </p>
      </div>
    </div>
    <app-options-dropdown
      class="shadow-[0_2px_8px_rgba(0,0,0,0.07)] md:shadow-none rounded-[10px]"
      [filters]="filterConfigs()"
      [filterValues]="filterValues()"
      [headerPin]="headerPin"
      [actions]="dropdownActions()"
      [isLoading]="loading()"
      triggerLabel="Filtros"
      triggerIcon="filter"
      [debounceMs]="350"
      (filterChange)="onFilterChange($event)"
      (clearAllFilters)="onClearAllFilters()"
      (actionClick)="onActionClick($event)"
    ></app-options-dropdown>
  </div>

  <!-- Tendencia: dos gráficas (sin eje doble) -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <app-card shadow="none" [responsivePadding]="true">
      <span class="text-sm font-bold text-[var(--color-text-primary)]">Recaudado por periodo</span>
      <div class="h-[300px] mt-2">
        <app-chart [options]="amountChartOptions()" [loading]="loading()"></app-chart>
      </div>
    </app-card>

    <app-card shadow="none" [responsivePadding]="true">
      <span class="text-sm font-bold text-[var(--color-text-primary)]">Cantidad de pagos por periodo</span>
      <div class="h-[300px] mt-2">
        <app-chart [options]="countChartOptions()" [loading]="loading()"></app-chart>
      </div>
    </app-card>
  </div>

  <!-- Desglose por estado -->
  <app-card shadow="none" [responsivePadding]="true">
    <span class="text-sm font-bold text-[var(--color-text-primary)]">Desglose por estado</span>
    <div class="mt-3">
      <app-responsive-data-view
        [data]="stateRows()"
        [columns]="stateColumns"
        [cardConfig]="stateCardConfig"
        [loading]="loading()"
        emptyMessage="No hay pagos en el periodo"
        emptyIcon="credit-card"
      ></app-responsive-data-view>
    </div>
  </app-card>
</div>
