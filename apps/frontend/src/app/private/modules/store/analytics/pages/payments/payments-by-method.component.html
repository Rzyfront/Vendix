<div class="space-y-6 w-full max-w-[1600px] mx-auto py-4">
  <!-- KPI cards -->
  <div class="stats-container sticky top-0 z-20 bg-background md:static md:bg-transparent">
    <app-stats
      title="Recaudado"
      [value]="(summary()?.total_collected ?? 0) | currency"
      smallText="Total del periodo, todos los métodos"
      iconName="wallet"
      iconBgColor="bg-purple-100"
      iconColor="text-purple-600"
      [loading]="loading() && !summary()"
    ></app-stats>

    <app-stats
      title="Pagos Recaudados"
      [value]="summary()?.collected_count ?? 0"
      smallText="Base del % por método"
      iconName="receipt"
      iconBgColor="bg-blue-100"
      iconColor="text-blue-600"
      [loading]="loading() && !summary()"
    ></app-stats>

    <app-stats
      title="Métodos con Recaudo"
      [value]="rows().length"
      smallText="Métodos usados en el periodo"
      iconName="credit-card"
      iconBgColor="bg-emerald-100"
      iconColor="text-emerald-600"
      [loading]="loading() && !summary()"
    ></app-stats>
  </div>

  <!-- Header + filters -->
  <div
    class="flex items-center justify-between gap-3 sticky top-0 z-10 bg-surface px-4 py-3 border-b border-border rounded-lg mx-1 mb-4"
  >
    <div class="flex items-center gap-2.5 min-w-0">
      <div
        class="hidden md:flex w-10 h-10 rounded-lg bg-[var(--color-background)] items-center justify-center border border-[var(--color-border)] shadow-sm shrink-0"
      >
        <app-icon name="pie-chart" class="text-[var(--color-primary)]"></app-icon>
      </div>
      <div class="min-w-0">
        <h1 class="text-base md:text-lg font-bold text-[var(--color-text-primary)] leading-tight truncate">
          Pagos por Método
        </h1>
        <p class="hidden sm:block text-xs text-[var(--color-text-secondary)] font-medium truncate">
          Participación de cada método de pago en el recaudo del periodo
        </p>
      </div>
    </div>
    <app-options-dropdown
      class="shadow-[0_2px_8px_rgba(0,0,0,0.07)] md:shadow-none rounded-[10px]"
      [filters]="filterConfigs()"
      [filterValues]="filterValues()"
      [headerPin]="headerPin"
      [actions]="dropdownActions()"
      [isLoading]="loading()"
      triggerLabel="Filtros"
      triggerIcon="filter"
      [debounceMs]="350"
      (filterChange)="onFilterChange($event)"
      (clearAllFilters)="onClearAllFilters()"
      (actionClick)="onActionClick($event)"
    ></app-options-dropdown>
  </div>

  <!-- Gráfica de participación -->
  <app-card shadow="none" [responsivePadding]="true">
    <div class="flex items-center justify-between gap-2">
      <span class="text-sm font-bold text-[var(--color-text-primary)]">Participación por método</span>
      <div class="inline-flex rounded-lg border border-border overflow-hidden" role="group" aria-label="Tipo de gráfica">
        <button
          type="button"
          class="px-3 py-1.5 text-xs font-medium"
          [class.bg-primary]="chartType() === 'donut'"
          [class.text-white]="chartType() === 'donut'"
          [attr.aria-pressed]="chartType() === 'donut'"
          (click)="setChartType('donut')"
        >
          Dona
        </button>
        <button
          type="button"
          class="px-3 py-1.5 text-xs font-medium border-l border-border"
          [class.bg-primary]="chartType() === 'bar'"
          [class.text-white]="chartType() === 'bar'"
          [attr.aria-pressed]="chartType() === 'bar'"
          (click)="setChartType('bar')"
        >
          Barras
        </button>
      </div>
    </div>
    <div class="h-[340px] mt-2">
      <app-chart [options]="chartOptions()" [loading]="loading()"></app-chart>
    </div>
  </app-card>

  <!-- Tabla -->
  <app-card shadow="none" [responsivePadding]="true">
    <span class="text-sm font-bold text-[var(--color-text-primary)]">Detalle por método</span>
    <div class="mt-3">
      <app-responsive-data-view
        [data]="rows()"
        [columns]="columns"
        [cardConfig]="cardConfig"
        [loading]="loading()"
        emptyMessage="No hay pagos recaudados en el periodo"
        emptyIcon="credit-card"
      ></app-responsive-data-view>
    </div>
  </app-card>
</div>
