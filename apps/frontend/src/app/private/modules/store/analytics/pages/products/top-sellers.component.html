<div class="space-y-6 w-full max-w-[1600px] mx-auto py-4">
  <!-- Stats Cards -->
  <div class="stats-container sticky top-0 z-20 bg-background md:static md:bg-transparent">
    <app-stats
      title="Total Productos"
      [value]="totalProducts()"
      smallText=" productos"
      iconName="package"
      iconBgColor="bg-blue-100"
      iconColor="text-blue-600"
    ></app-stats>

    <app-stats
      title="Unidades Vendidas"
      [value]="totalUnits()"
      smallText=" totales"
      iconName="boxes"
      iconBgColor="bg-purple-100"
      iconColor="text-purple-600"
    ></app-stats>

    <app-stats
      title="Ingresos Totales"
      [value]="totalRevenue()"
      iconName="dollar-sign"
      iconBgColor="bg-green-100"
      iconColor="text-green-600"
    ></app-stats>

    <app-stats
      title="Top Producto"
      [value]="topProductName()"
      iconName="trophy"
      iconBgColor="bg-amber-100"
      iconColor="text-amber-600"
    ></app-stats>
  </div>

    <app-card shadow="none" [padding]="false" overflow="hidden" [showHeader]="true">
    <div slot="header" class="results-header flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-2 min-w-0">
        <app-icon name="trophy" [size]="20" class="shrink-0 text-[var(--color-primary)]"></app-icon>
        <span class="results-header__title text-base md:text-lg font-bold text-[var(--color-text-primary)] leading-tight whitespace-nowrap">Productos Más Vendidos</span>
      </div>
      <div class="flex items-end gap-2 flex-wrap shrink-0">
      <vendix-date-range-filter
                [value]="dateRange()"
                (valueChange)="onDateRangeChange($event)"
              ></vendix-date-range-filter>
            <app-options-dropdown
              [filters]="[]"
              [actions]="dropdownActions()"
              [showActions]="true"
              triggerLabel="Acciones"
              triggerIcon="plus"
              [isLoading]="exporting()"
              (actionClick)="onActionsDropdownClick($event)"
            ></app-options-dropdown>
      </div>
    </div>
    <div class="p-4 space-y-6">


  <!-- Content Grid -->
  <div class="grid grid-cols-1 gap-6">
  <!-- Chart -->
  <app-card
    shadow="none"
    [padding]="false"
    overflow="hidden"
    [showHeader]="true"
  >
    <div slot="header" class="results-header flex flex-col">
      <span class="text-sm font-bold text-[var(--color-text-primary)]"
        >Top 10 por Ingresos</span
      >
      <span class="text-xs text-[var(--color-text-secondary)]"
        >Productos con mayor facturación en el período</span
      >
    </div>
    <div class="p-4">
      @if (loadingTopSellers()) {
        <div class="h-80 flex items-center justify-center">
          <div
            class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"
          ></div>
        </div>
      } @else {
        @defer (on immediate) {
          <app-chart
            [options]="topSellersChartOptions()"
            size="large"
          ></app-chart>
        } @placeholder {
          <div class="h-80 bg-surface-secondary animate-pulse rounded-xl"></div>
        }
      }
    </div>
  </app-card>
  </div>

  <!-- Quick Links -->
  <app-card shadow="none" [responsivePadding]="true" class="md:mt-4">
    <span class="text-sm font-bold text-[var(--color-text-primary)]">Vistas de Productos</span>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">
      @for (view of productsViews; track view.key) {
        <app-analytics-card [view]="view"></app-analytics-card>
      }
    </div>
  </app-card>
    </div>
  </app-card>
</div>
