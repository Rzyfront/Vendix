<app-modal [(isOpen)]="isOpen" title="Dividir cuenta" subtitle="Reparte la cuenta entre varias personas" size="xl" [dialog]="true">
  @if (isOpen() && orderId(); as id) {
    <app-split-accounts-panel [sourceOrderId]="id" [items]="items()" (splitCompleted)="splitCompleted.emit($event)" />
  }
</app-modal>
