# Usuario bajo el cual corre Nginx
user  nginx;

# Número de procesos worker (auto para automático)
worker_processes  auto;

# Archivo de log de errores y nivel de logging
error_log  /var/log/nginx/error.log warn;

# Archivo donde se guarda el PID del proceso principal
pid        /var/run/nginx.pid;

# Bloque de configuración de eventos (manejo de conexiones)
events { worker_connections  1024; }

# Bloque HTTP: configuración global para el protocolo HTTP
http {
    # DNS interno de Docker para resolver nombres de servicio
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Soporte WebSockets: map de Upgrade -> Connection
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Logs formato extendido
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" ' 
                    'Host:$host UA:"$http_user_agent" RT:$request_time';
    access_log /var/log/nginx/access.log main;

    # Ajustes básicos
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml image/svg+xml;

    # Tamaño máximo del body (alineado con NestJS json limit de 50mb)
    client_max_body_size 50m;

    # Upstreams
    upstream vendix_frontend {
        # `ng serve` corre NATIVO en macOS, fuera de Docker (ver README,
        # "Arranque local"). Dentro de la VM de Colima (vmType: vz),
        # host.docker.internal resuelve a 192.168.5.2 —la direccion del host
        # macOS bajo gvproxy—, verificado con:
        #   docker exec vendix_nginx getent hosts host.docker.internal
        #
        # El servicio `frontend` del compose sigue existiendo bajo el perfil
        # `docker-fe` como respaldo. Si se levanta, publica el mismo 4200 en el
        # host, asi que este upstream lo alcanza sin cambiar nada — pero NO se
        # deben tener ambos a la vez: el segundo choca por el puerto 4200.
        server host.docker.internal:4200;
    }
    upstream vendix_backend {
        server backend:3000;
    }

    # Servidor para redirección HTTP a HTTPS
    server {
        listen 80;
        # FIX QUI-TIENDA-ONLINE: el redirect HTTP→HTTPS tiene que cubrir la
        # navegación desde `window.open('https://<subdominio>.vendix.com')` que
        # lanza el botón "Abrir Tienda" de /admin/ecommerce.
        #
        # Wildcard en vez de listar los subdominios de cada tenant: este archivo
        # lo monta docker-compose.yml para todo el equipo, así que escribir los
        # hostnames de una tienda concreta obliga a editarlo por cada tenant
        # nuevo. nginx resuelve los nombres exactos antes que el wildcard, así
        # que el server block de api.vendix.com de abajo sigue ganando.
        server_name vendix.com *.vendix.com;
        # 308 (no 301): preserva el método HTTP y el body al redirigir. Un 301
        # sobre un POST hace que el navegador reintente como GET sin body
        # (p.ej. POST /api/shipping/calculate -> GET => 404 "Cannot GET"). El
        # 308 mantiene el POST intacto tras el upgrade a HTTPS.
        return 308 https://$host$request_uri;
    }

    # Servidor para frontend (vendix.com, www.vendix.com, subdominios de tienda)
    server {
        listen 443 ssl;
        # FIX QUI-TIENDA-ONLINE: cualquier subdominio de tenant entra acá; el
        # frontend Angular resuelve app_type por hostname y hace el routing
        # client-side. `api.vendix.com` tiene su propio server block con nombre
        # exacto, que nginx prioriza sobre este wildcard.
        server_name vendix.com *.vendix.com;

        ssl_certificate /etc/ssl/certs/vendix_com.crt;
        ssl_certificate_key /etc/ssl/certs/vendix_com.key;
        
        # Configuración SSL moderna
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # QUI-263: el manifest PWA y los iconos de la app instalada los resuelve
        # el backend por hostname, pero tienen que servirse desde el ORIGEN DEL
        # TENANT: Chromium sólo considera instalable un manifest fetchable del
        # mismo origen, y el <link> estático de index.html debe funcionar antes
        # de que Angular arranque.
        #
        # Van declarados ANTES del `location /` de abajo porque ese fuerza
        # `Host localhost`, que anularía la resolución por hostname. Acá se
        # reenvía el $host real y NO se setea X-Forwarded-Host, para que el
        # backend tome el Host del viewer como fuente de verdad del tenant.
        #
        # Equivalente en producción: dos cache behaviors en CloudFront
        # E1I27OYFJX7VYJ (`manifest.webmanifest` y `pwa/*`) contra el origin
        # vendix-backend-api-pwa.
        location = /manifest.webmanifest {
            proxy_pass http://vendix_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /pwa/ {
            proxy_pass http://vendix_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://vendix_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # Servidor para backend (api.vendix.com) con SSL
    server {
        listen 443 ssl;
        server_name api.vendix.com;

        ssl_certificate /etc/ssl/certs/vendix_com.crt;
        ssl_certificate_key /etc/ssl/certs/vendix_com.key;
        
        # Configuración SSL moderna
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # SSE endpoint — long-lived connections, no buffering, no timeouts
        location /api/store/notifications/stream {
            proxy_pass http://vendix_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # SSE del chat de Vexi — mismo trato que el de notificaciones, y por la
        # misma razón. Sin este bloque cae en el `location /` de abajo, que NO
        # declara `proxy_read_timeout`, así que hereda el default de nginx: 60 s
        # de silencio y nginx corta la conexión al upstream.
        #
        # Un turno hablado pasa por ese silencio de forma rutinaria: la ventana
        # más callada es la que va DESPUÉS de que el texto terminó, mientras el
        # sintetizador procesa la cola de segmentos. El navegador ve un error de
        # transporte sin código HTTP —un SSE cortado a mitad del cuerpo sigue
        # siendo 200— y el usuario lee "se cayó la conexión" sobre una respuesta
        # que ya estaba generada y persistida en la base.
        #
        # El backend además manda un latido cada 15 s, que es la otra mitad de la
        # defensa: este bloque cubre a nginx, el latido cubre a cualquier
        # intermediario que no controlamos.
        #
        # Regex y no prefijo porque el stream vive al FINAL de la ruta. Un
        # `location /api/store/ai-chat/conversations` habría capturado también el
        # `POST .../stream-intent` y el `PATCH .../archive`, regalándole 24 h de
        # tolerancia a peticiones que deben fallar rápido. El `$` es lo que
        # distingue `/stream` de `/stream-intent`.
        location ~ ^/api/store/ai-chat/conversations/[0-9]+/stream$ {
            proxy_pass http://vendix_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://vendix_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}