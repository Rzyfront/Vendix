# Rafael, 2026-10-14 01:39: «ningún job debe tardar más de ~5 minutos;
# corta todo lo que sea necesario». PR/push conservan sólo gates rápidos,
# con timeout de 10 min como margen (no como duración objetivo).
# Las suites completas de los siete carriles POS + products viven en
# backend-full-tests.yml (nocturno/manual, NO requerido para merge).
# Se retira del camino de merge el antiguo Jest global, ya deshabilitado.
name: CI

on:
  pull_request:
    branches: [main, develop]
  # Develop admite commits directos; main ya se valida por PR de release.
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

# Cada PR/rama cancela sólo sus corridas anteriores, no las de otro evento.
# Audits omite el push cuando un PR abierto ya cubre esta rama.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  audits:
    name: Audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_ci: ${{ steps.ci_gate.outputs.run_ci }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      backend: ${{ steps.filter.outputs.backend }}
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Decidir si ejecutar CI (push cubierto por PR)
        id: ci_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Este primer paso aún no tiene checkout para resolver el repo.
          GH_REPO: ${{ github.repository }}
        run: |
          run_ci=true
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            if pr_count="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq length)"; then
              if [[ "$pr_count" =~ ^[1-9][0-9]*$ ]]; then
                run_ci=false
              fi
            else
              echo "::warning::No se pudo consultar PRs abiertos; CI se ejecutará por seguridad."
            fi
          fi
          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"
      # F-193: paths-filter necesita checkout en push (diff con git local).
      # Historia completa también para state-refresh (origin/BASE_REF...HEAD).
      # Sin base explícita se conserva la resolución histórica de paths-filter.
      - uses: actions/checkout@v4
        if: steps.ci_gate.outputs.run_ci == 'true'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.ci_gate.outputs.run_ci == 'true'
        with:
          # Entradas compartidas gatean las tres apps; cada app conserva su filtro.
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - 'libs/**'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - '.github/workflows/backend-full-tests.yml'
            frontend:
              - *shared
              - 'apps/frontend/**'
              - 'scripts/zoneless-audit.sh'
              - 'scripts/state-refresh-audit.sh'
              - 'scripts/industry-parity-audit.sh'
            mobile:
              - *shared
              - 'apps/mobile/**'
            backend:
              - *shared
              - 'apps/backend/**'
              - 'scripts/tz-audit.sh'
              - 'scripts/tenant-host-audit.sh'
              - 'scripts/prisma-singleton-audit.sh'
              - 'scripts/industry-parity-audit.sh'
              - 'scripts/check-tools-no-prisma.sh'
      - uses: actions/setup-node@v4
        if: steps.ci_gate.outputs.run_ci == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      # Las siete auditorías sólo requieren bash/grep/node, no npm ci ni build.
      # !cancelled() ejecuta las siguientes aunque otra falle; sin
      # continue-on-error, cualquier fallo conserva el job rojo.
      - name: Zoneless Audit
        if: ${{ !cancelled() && steps.ci_gate.outputs.run_ci == 'true' && steps.filter.outputs.frontend == 'true' }}
        run: bash scripts/zoneless-audit.sh
      - name: State Refresh Audit
        if: ${{ !cancelled() && steps.ci_gate.outputs.run_ci == 'true' && steps.filter.outputs.frontend == 'true' }}
        run: bash scripts/state-refresh-audit.sh
      - name: TZ Audit
        if: ${{ !cancelled() && steps.ci_gate.outputs.run_ci == 'true' && steps.filter.outputs.backend == 'true' }}
        run: bash scripts/tz-audit.sh
      - name: Tenant Host Audit
        if: ${{ !cancelled() && steps.ci_gate.outputs.run_ci == 'true' && steps.filter.outputs.backend == 'true' }}
        run: bash scripts/tenant-host-audit.sh
      - name: Prisma Singleton Audit
        if: ${{ !cancelled() && steps.ci_gate.outputs.run_ci == 'true' && steps.filter.outputs.backend == 'true' }}
        run: bash scripts/prisma-singleton-audit.sh
      - name: Tools No-Prisma Gate
        if: ${{ !cancelled() && steps.ci_gate.outputs.run_ci == 'true' && steps.filter.outputs.backend == 'true' }}
        run: bash scripts/check-tools-no-prisma.sh
      - name: Industry Parity Audit
        if: ${{ !cancelled() && steps.ci_gate.outputs.run_ci == 'true' && (steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true') }}
        run: bash scripts/industry-parity-audit.sh

  backend-build:
    name: Backend Build (prisma + nest)
    runs-on: ubuntu-latest
    needs: audits
    if: needs.audits.outputs.run_ci == 'true' && needs.audits.outputs.backend == 'true'
    # Última corrida: ~4 min, secuencia de producción intacta.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # Generar ANTES de compilar: tipos del schema actual; no requiere DB.
      - name: Generar Prisma Client
        working-directory: apps/backend
        run: npx prisma generate
      # nest build excluye specs; este paso mantiene el gate de tipos de tests.
      - name: Typecheck de specs (buildcheck:types)
        working-directory: apps/backend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run buildcheck:types
      - name: nest build
        working-directory: apps/backend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
      - name: assert build assets
        working-directory: apps/backend
        run: node scripts/assert-build-assets.js

  backend-test-pr-regressions:
    name: Backend Tests (PR regressions)
    runs-on: ubuntu-latest
    needs: audits
    if: needs.audits.outputs.run_ci == 'true' && needs.audits.outputs.backend == 'true'
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PR_BASE: ${{ github.event.pull_request.base.ref }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Diff contra el head real, no el merge sintético de pull_request.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Decidir antes de instalar/generar: los skips cuestan sólo checkout.
      - name: Seleccionar specs backend cambiados (máximo 25)
        id: specs
        shell: bash
        run: |
          set -euo pipefail
          echo "run=false" >> "$GITHUB_OUTPUT"
          if [[ "$PR_BASE" == 'main' ]]; then
            echo "PR base main: release ya probado en develop; regresiones omitidas. Cobertura POS/products en backend-full-tests.yml." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$PR_BASE" ]]; then
            comparison="$BASE_SHA...HEAD"
          else
            # Primer push: árbol vacío; pushes normales: before..HEAD.
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git hash-object -t tree /dev/null)"
            fi
            comparison="$BASE_SHA..HEAD"
          fi
          list="$RUNNER_TEMP/backend-pr-regression-specs.paths"
          git diff --name-only -z --diff-filter=ACMRT "$comparison" -- ':(glob)apps/backend/src/**/*.spec.ts' > "$list"
          mapfile -d '' -t specs < "$list"
          count="${#specs[@]}"
          if (( count == 0 )); then
            echo "Sin specs backend cambiados; regresiones omitidas." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if (( count > 25 )); then
            echo "Regresiones omitidas: $count specs cambiados superan el tope de 25. Ejecutar backend-full-tests.yml (nocturno/manual, POS + products)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for spec in "${specs[@]}"; do
            test -f "$spec"
            echo "Regression spec: $spec"
          done
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Regresiones: $count specs cambiados, Jest con 2 workers." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.specs.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
        if: steps.specs.outputs.run == 'true'
      - name: Generar Prisma Client (regresiones de PR)
        if: steps.specs.outputs.run == 'true'
        working-directory: apps/backend
        run: npx prisma generate
      - name: Jest paralelo — specs backend cambiados
        if: steps.specs.outputs.run == 'true'
        working-directory: apps/backend
        shell: bash
        # ~1 min de setup + máximo 8 min de Jest. Agotar el presupuesto falla,
        # no oculta regresiones con un verde. No usar test:path (runInBand).
        # 8 y no 4: con 21 specs (303 tests) Jest tardó 243 s y el paso se cortó.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mapfile -d '' -t changed < "$RUNNER_TEMP/backend-pr-regression-specs.paths"
          specs=()
          for spec in "${changed[@]}"; do
            specs+=("${spec#apps/backend/}")
          done
          # F1: rutas exactas, no regex OR; además exigir que Jest descubra
          # TODAS antes de ejecutar (una ruta ignorada no puede quedar verde).
          npx jest --listTests --json --maxWorkers=2 --runTestsByPath "${specs[@]}" > "$RUNNER_TEMP/backend-pr-discovered.json"
          node - "$RUNNER_TEMP/backend-pr-discovered.json" "${specs[@]}" <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const found = new Set(JSON.parse(fs.readFileSync(process.argv[2], 'utf8')));
          const missing = process.argv.slice(3).filter(spec => !found.has(path.resolve(spec)));
          if (missing.length) {
            console.error('Jest no descubrió todos los specs cambiados:', missing);
            process.exit(1);
          }
          JS
          npx jest --ci --maxWorkers=2 --runTestsByPath "${specs[@]}"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: audits
    if: needs.audits.outputs.run_ci == 'true' && needs.audits.outputs.frontend == 'true'
    # Estimación: build medido ~3 min + Karma <=2 min, menos el setup duplicado.
    # Se conserva el subconjunto zoneless ya acotado, nunca la suite global.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # Mismo build AOT que deploy-s3.yml.
      - name: Build AOT de producción
        working-directory: apps/frontend
        run: npm run build:prod
      # Sin Zone.js; watch=false para terminar y launcher CI sin sandbox.
      - name: Karma zoneless (subconjunto de regresiones)
        working-directory: apps/frontend
        run: >-
          npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
          --progress=false
          --include='**/interceptors/auth.interceptor.spec.ts'
          --include='**/legal/document-viewer/legal-document-metadata.spec.ts'
          --include='**/pos/utils/document-format-hint.util.spec.ts'
          --include='**/pos/utils/phone-format-hint.util.spec.ts'
          --include='**/pos/services/pos-cart.service.spec.ts'
          --include='**/pos/services/pos-payment.service.spec.ts'
          --include='**/pos/services/pos-ticket.service.spec.ts'
          --include='**/pos/components/pos-order-confirmation.component.spec.ts'
          --include='**/shared/services/print/document-print.service.spec.ts'
          --include='**/analytics/config/analytics-registry.spec.ts'
          --include='**/orders/pages/order-details/can-resend.spec.ts'
          --include='**/orders/components/order-payment-modal/order-payment-modal.component.spec.ts'
          --include='**/orders/components/order-refund-modal/order-refund-modal.component.spec.ts'
          --include='**/orders/pages/order-details/cancel-order-default-disposition.spec.ts'
          --include='**/shared/components/item-cancellation-modal/item-cancellation-modal.component.spec.ts'
          --include='**/orders/utils/fiscal-alert-dictionary.spec.ts'
          --include='**/pos/components/pos-checkout-shell/pos-checkout-shell.component.spec.ts'
          --include='**/pos/components/pos-checkout-shell/steps/pos-shipping-step.component.spec.ts'
          --include='**/print-formats/services/print-annex-validator.service.spec.ts'
          --include='**/settings/shipping/components/add-rate-wizard-modal/add-rate-wizard-modal.component.spec.ts'
          --include='**/settings/shipping/components/method-zones-inline/method-zones-inline.component.spec.ts'
          --include='**/shared/components/payment-collector/payment-collector.component.spec.ts'
          --include='**/store/inventory/pop/**/*.spec.ts'
          --include='**/shared/components/item-list/item-list.tooltip.spec.ts'
          --include='**/orders/components/orders-list/orders-list.kds.spec.ts'
          --include='**/orders/services/orders-list-sse.service.spec.ts'
          --include='**/orders/components/orders-list/order-kitchen-summary.util.spec.ts'
          --include='**/shared/components/item-list/item-list.component.spec.ts'
          --include='**/orders/components/orders-list/orders-list.component.spec.ts'
          --include='**/inventory/inventory-dashboard.component.spec.ts'
          --include='**/ecommerce/pages/guest-order-summary/guest-order-summary.component.spec.ts'
          --include='**/ecommerce/pages/account/order-detail/order-detail.component.spec.ts'
          --include='**/reports/services/reports-data.service.spec.ts'
          --include='**/reports/state/reports.effects.spec.ts'
          --include='**/shared/directives/pull-to-refresh.directive.spec.ts'
          --include='**/reviews/review-summary.component.spec.ts'
          --include='**/products/utils/variant-stock-requirements.util.spec.ts'
          --include='**/products/utils/variant-price-inheritance.util.spec.ts'
          --include='**/shared/services/pricing/price-resolver.service.spec.ts'
          --include='**/price-tiers/utils/price-tier-rule.util.spec.ts'
          --include='**/price-tier-form-page/price-tier-form-page.component.spec.ts'
          --include='**/customers/components/customer-modal/customer-modal.component.spec.ts'
          --include='**/pos/utils/customer-tier-prompt.util.spec.ts'
          --include='**/pos/components/pos-customer-tier-modal.component.spec.ts'
          --include='**/orders/utils/order-customer-tier-prompt.util.spec.ts'
          --include='**/customer-holder-completion-modal/holder-issue.model.spec.ts'
          --include='**/orders/bulk/orders-bulk-invoice.util.spec.ts'
          --include='**/credit-invoice-modal/credit-invoice-modal.component.spec.ts'

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    needs: audits
    if: needs.audits.outputs.run_ci == 'true' && needs.audits.outputs.mobile == 'true'
    # Ambos jobs previos <=2 min; compartir setup estima <=4 min combinados.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit
      # Metro valida módulos reales; no EAS, credenciales ni .env locales.
      - name: expo export
        working-directory: apps/mobile
        env:
          EXPO_NO_DOTENV: '1'
        run: npm run build:preview
