name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

# Los builds de AOT y de nest tardan minutos, así que un PR que recibe varios
# pushes seguidos no necesita terminar los runs viejos.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `shared` son entradas que alimentan el build de las TRES apps sin
          # vivir en el directorio de ninguna. Van incluidas en los tres
          # filtros a propósito: un `package-lock.json` regenerado en otro SO
          # rompe los tres builds y no toca ni un archivo de `apps/**`, así que
          # sin esto quedaría fuera de todo gate (pasó en el PR #444). El
          # propio ci.yml está incluido para que cambiarlo se autoverifique.
          #
          # Cambiar sólo código de una app sigue corriendo únicamente el build
          # de esa app.
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - 'libs/**'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
            frontend:
              - *shared
              - 'apps/frontend/**'
              - 'scripts/state-refresh-audit.sh'
              - 'scripts/industry-parity-audit.sh'
            mobile:
              - *shared
              - 'apps/mobile/**'
              - 'scripts/industry-parity-audit.sh'
            backend:
              - *shared
              - 'apps/backend/**'
              - 'scripts/tz-audit.sh'
              - 'scripts/tenant-host-audit.sh'
              - 'scripts/industry-parity-audit.sh'

  zoneless-audit:
    name: Zoneless Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    # Pass the PR's actual base ref to the audit script so it diffs against
    # the right integration branch (main or dev). Without this, the script
    # would diff against origin/main by default, flagging pre-existing
    # legacy patterns in dev that are not part of this PR.
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so `origin/<BASE_REF>` is available locally
          # for the script's `git diff origin/<BASE_REF>...HEAD` call.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # NOTA: `cache:` se omite intencionalmente. Pasar `false` o string
      # vacío rompe el action con 'Caching for false is not supported'.
      # Ver docs/setup-node@v4 — omitir el parámetro es la forma soportada
      # de desactivar npm caching.
      - run: npm ci
      - run: chmod +x scripts/zoneless-audit.sh
      - run: ./scripts/zoneless-audit.sh

  state-refresh-audit:
    name: State Refresh Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    # QUI-554: un componente que muta por HTTP directo dentro de un módulo con
    # NgRx se salta la cadena acción → effect → refresh, así que "guardé y no se
    # ve" pasa el code review porque el POST sí funciona. Guard de puro grep
    # sobre el árbol (sin build ni deps). Falla sólo por los archivos del PR; la
    # deuda preexistente se reporta como warning.
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: el script hace `git diff origin/<BASE_REF>...HEAD`.
          fetch-depth: 0
      - run: chmod +x scripts/state-refresh-audit.sh
      - run: ./scripts/state-refresh-audit.sh

  tz-audit:
    name: TZ Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Pure grep guard over the checked-out tree (no build/deps needed): fails if
    # any module reintroduces UTC day/month bucketing outside the store-timezone
    # primitive (QUI-487). See scripts/tz-audit.sh + docs/architecture/store-timezone.md.
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/tz-audit.sh
      - run: ./scripts/tz-audit.sh

  tenant-host-audit:
    name: Tenant Host Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Pure grep guard over the checked-out tree (no build/deps needed): fails if
    # any module resolves the tenant hostname outside the primitive (QUI-564).
    # `x-forwarded-host` carries a FIXED value injected by CloudFront in prod, so
    # reading it first serves the platform's assets to every tenant domain.
    # See scripts/tenant-host-audit.sh + apps/backend/src/common/utils/tenant-hostname.util.ts.
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/tenant-host-audit.sh
      - run: ./scripts/tenant-host-audit.sh

  industry-parity-audit:
    name: Industry Parity Audit
    runs-on: ubuntu-latest
    needs: changes
    # Corre si cambia CUALQUIERA de las tres apps: `industry_enum` vive en el
    # backend y está espejado a mano en web y en móvil, así que la deriva puede
    # nacer en cualquiera de los tres lados.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.mobile == 'true'
    # Pure grep guard over the checked-out tree (no build/deps needed): fails if
    # `industry_enum` (schema.prisma, la verdad) y sus tres espejos a mano
    # dejan de coincidir. NINGÚN tipo une el enum de Prisma con los espejos de
    # web y móvil — viven en proyectos tsconfig distintos y ninguno importa
    # `@prisma/client` — así que ni tsc ni los builds detectan esta deriva.
    # Peor: en el móvil el `Record<StoreIndustry, string[]>` la ESCONDE, porque
    # `StoreIndustry` se deriva de la propia lista del archivo; compila perfecto
    # y en runtime la industria nueva se queda sin reglas de ocultamiento.
    # Encontrado el 2026-08-23 al agregar `construction`: de cinco copias, dos
    # llevaban rancias (`gym` faltaba en el wizard de onboarding desde que se
    # agregó esa industria). See scripts/industry-parity-audit.sh.
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/industry-parity-audit.sh
      - run: ./scripts/industry-parity-audit.sh

  mobile-typecheck:
    name: Mobile Typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # NOTA: `cache:` se omite intencionalmente. Pasar `false` o string
      # vacío rompe el action con 'Caching for false is not supported'. Sin
      # este parámetro el action funciona correctamente y desactiva cache
      # por defecto. Ver docs/setup-node@v4.
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/mobile

  # ---------------------------------------------------------------------------
  # Builds de producción, uno por app y sólo si esa app cambió.
  #
  # Por qué existen: hasta ahora el CI eran dos greps y un `tsc` de mobile.
  # Ninguno compilaba, así que toda una clase de errores llegaba a `dev` con
  # los checks en verde:
  #
  #   - Angular sólo reporta en AOT (`ng build --configuration production`) el
  #     acceso a miembros `private` desde plantilla (TS2341) y los
  #     `templateUrl` que apuntan a archivos inexistentes. En modo dev (JIT)
  #     ambos pasan. Los dos casos llegaron a ramas distintas.
  #   - `nest build` sin un `prisma generate` previo typechequea contra el
  #     cliente Prisma anterior. Un cambio de schema puede dar 0 errores en
  #     local y 17 después de regenerar, que es exactamente lo que rompe la
  #     imagen de producción.
  # ---------------------------------------------------------------------------

  frontend-build:
    name: Frontend Build (prod)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # Mismo comando que `deploy-s3.yml` corre para publicar a producción: si
      # esto pasa, el deploy compila.
      - name: Build AOT de producción
        working-directory: apps/frontend
        run: npm run build:prod

  frontend-test:
    name: Frontend Tests (karma zoneless)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    # Este job NO existia: habia ~40 specs en apps/frontend y cero corridas en
    # CI, asi que un spec roto llegaba a `dev` con todos los checks verdes. Es
    # una compuerta de verdad -- sin `continue-on-error`: si un spec falla, el
    # PR se pone rojo. Un job que no puede ponerse rojo no es una compuerta.
    #
    # `--watch=false` es obligatorio: el default del builder
    # (@angular/build:karma) es `watch: true`, que nunca termina y colgaria el
    # runner hasta el timeout.
    #
    # `--browsers=ChromeHeadlessNoSandbox` usa el customLauncher declarado en
    # `apps/frontend/karma.conf.js` (--no-sandbox --headless --disable-gpu
    # --disable-dev-shm-usage). Sin --no-sandbox Chrome no arranca dentro del
    # runner, y sin --disable-dev-shm-usage se cae por /dev/shm pequeno. El
    # binario lo autodetecta karma-chrome-launcher: la imagen ubuntu-latest
    # trae google-chrome-stable preinstalado.
    #
    # `karma.conf.js` tambien sube `browserNoActivityTimeout` a 180s. Con el
    # default (30s) la suite se cortaba con "Disconnected, because no message in
    # 30000 ms" a mitad de camino -- y un renglon final que dice DISCONNECTED en
    # vez de SUCCESS/FAILED es cobertura apagada disfrazada de corrida. Se
    # reproducia igual con y sin Zone.js, asi que preexiste al arnes zoneless.
    #
    # El arnes corre SIN Zone.js (target `test` con "polyfills": []), igual que
    # el build de produccion. Ver apps/frontend/src/test-init.ts.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: ng test (PR scope — specs touched in this PR)
        working-directory: apps/frontend
        # Scope to only the specs touched by this PR's commits. Other
        # specs (NgRx Store, Breadcrumb analytics, etc.) fail in
        # origin/dev and are tracked in separate tickets — not in
        # scope of QUI-723.
        run: >-
          npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
          --progress=false
          --include='**/interceptors/auth.interceptor.spec.ts'
          --include='**/pos/utils/document-format-hint.util.spec.ts'
          --include='**/pos/utils/phone-format-hint.util.spec.ts'

  backend-build:
    name: Backend Build (prisma + nest)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # `prisma generate` ANTES de compilar, en ese orden y no al revés: es la
      # secuencia de `apps/backend/Dockerfile` (líneas 9 y 11) y es lo que hace
      # que el typecheck corra contra el cliente del schema de este PR y no
      # contra el que quedó en node_modules. No necesita base de datos: el
      # bloque `datasource` de schema.prisma no declara `url`.
      - name: Generar Prisma Client
        working-directory: apps/backend
        run: npx prisma generate
      # SALVEDAD (KG-9(a)): esto NO es un "typecheck completo" del backend.
      # `apps/backend/tsconfig.build.json` excluye `**/*spec.ts`, asi que ni
      # `nest build` aqui ni `npm run buildcheck:be` en local compilan las
      # specs. Un spec con error de tipos -- p.ej. los 4 `TS2554` de aridad de
      # `reservations.service.spec.ts` (QUI-649), que llegaron a produccion --
      # pasa este job en verde. La unica compuerta que SI las compila es
      # `backend-test` (jest via ts-jest), y hoy esta con `if: false`. Cualquier
      # afirmacion de "typecheck completo" apoyada en este job hereda esta
      # salvedad y debe decirlo.
      - name: nest build
        working-directory: apps/backend
        run: npm run build

  backend-test:
    # Hotfix post-PR-576: `tsconfig.build.json` excluye `**/*spec.ts` y
    # este workflow no corría jest, así que specs como el de QUI-649
    # (4 errores TS2554 de aridad en `reservations.service.spec.ts`)
    # llegaron a producción sin que nadie lo detectara. Ahora jest
    # corre en cada PR que toque apps/backend.
    name: Backend Tests (jest)
    runs-on: ubuntu-latest
    needs: changes
    #
    # ---------------------------------------------------------------------
    # PROPUESTA PARA @lider-dev sobre este `if: false` (2026-08-24, paso G.5)
    # ---------------------------------------------------------------------
    # NO se toca el flag. Es una decision con dueno y fecha, y su precondicion
    # ("re-enable when baseline tests fixed") NO esta cumplida. Lo que sigue es
    # lo medido, para que la decision se tome con datos y no con impresiones.
    #
    # 1. Tu diagnostico del 14-ago ("JEST too heavy for GH runners") queda
    #    CONFIRMADO por medicion, no era una impresion. Corriendo la suite
    #    completa en local (305 specs, --maxWorkers=2 --workerIdleMemoryLimit=
    #    1024MB, los topes de apps/backend/package.json) se reportaron
    #    5 suites en ~13 minutos, con tiempos por suite de 128 s, 144 s,
    #    160 s y 224 s. A ese ritmo la suite entera no cabe en el
    #    `timeout-minutes: 25` de este job: se necesitarian HORAS. Ademas un
    #    worker murio con `FatalProcessOutOfMemory` de V8.
    #
    # 2. La linea base esta ROJA, y de las dos maneras que hay que distinguir:
    #    - Fallo de asercion (el test corre y no cuadra) -- 33 en esas 5 suites.
    #      Ejemplos: `audit.controller.spec.ts` espera el prefijo 'admin/audit'
    #      y recibe 'superadmin/admin/audit' (el controlador cambio de namespace
    #      y el spec no); `reservations.service.spec.ts` espera
    #      BadRequestException y recibe NotFoundException.
    #    - "Test suite failed to run" (CERO tests ejecutados, que es cobertura
    #      apagada y NO un test rojo) -- 1: `audit.module.spec.ts`, y su causa
    #      es colateral: "A jest worker process was terminated by another
    #      process: signal=SIGTERM", o sea el OOM del punto 1. Esta categoria es
    #      la peligrosa porque NO aparece en el conteo de "Tests": una suite que
    #      no arranca se lee como verde si solo se mira esa linea.
    #    - Aparte, `audit.service.spec.ts` falla con "Nest can't resolve
    #      dependencies of SuperAdminAuditService ... GlobalPrismaService at
    #      index [0]": el TestBed se quedo atras del constructor real.
    #
    # 3. Por tanto la propuesta NO es "reactivar y listo", ni ahora ni con este
    #    contenido. Es esta secuencia, y el flag se voltea al final y lo
    #    volteas tu:
    #      (a) Arreglar las suites rojas por lotes, empezando por las 5 de
    #          arriba. Cada lote se verifica con
    #          `npm run buildcheck:test -- src/<ruta>` (--runInBand, ~1,5 GB).
    #      (b) Atacar el coste: 128-224 s por suite es tiempo de arranque de
    #          ts-jest reconstruyendo el programa TypeScript por worker. Los
    #          candidatos son `isolatedModules`/SWC como transform, o partir
    #          este job por dominio con `matrix:` para que ningun shard pase de
    #          los 25 minutos.
    #      (c) Solo cuando (a) y (b) esten hechas y una corrida completa termine
    #          en verde dentro del timeout, quitar el `if: false`.
    #
    # 4. Mientras tanto la Fase G NO se queda sin compuerta automatica: el job
    #    `frontend-test` (arriba) es nuevo y SI corre, y el typecheck de las
    #    specs del backend sigue cubierto en local por `buildcheck:test` por
    #    dominio. Lo que este job cubriria y hoy nadie cubre en CI es la
    #    ejecucion de los 305 specs del backend.
    # ---------------------------------------------------------------------
    if: false  # disabled per @lider-dev WhatsApp 2026-08-14 (JEST too heavy for GH runners). Re-enable when baseline tests fixed.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generar Prisma Client (para tipos en specs)
        working-directory: apps/backend
        run: npx prisma generate
      - name: jest (acotado, --runInBand)
        # El script `buildcheck:test` (raíz del monorepo) acepta `--test <path>`
        # para filtrar, o suite completa. Aquí corremos la suite entera con
        # pool acotado por el script (maxWorkers=2, workerIdleMemoryLimit=1GB).
        # Antes apuntaba a apps/backend y fallaba con "Missing script".
        run: npm run buildcheck:test -- --test

  mobile-build:
    name: Mobile Build (expo export)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # Complementa a `mobile-typecheck`: `tsc` resuelve por tipos, Metro
      # resuelve por módulo real, así que esto atrapa el import que existe para
      # TypeScript pero no se puede bundlear. No usa EAS ni credenciales.
      #
      # EXPO_NO_DOTENV=1 porque el runner no tiene los `.env*` locales
      # (`.env.web` está gitignoreado) y sin el flag expo intenta cargarlos.
      - name: expo export
        working-directory: apps/mobile
        env:
          EXPO_NO_DOTENV: '1'
        run: npm run build:preview
