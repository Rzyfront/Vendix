name: Deploy Backend to EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'apps/backend/Dockerfile'
      - 'apps/backend/package*.json'
      - 'apps/backend/prisma/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push Docker image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: vendix-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd apps/backend
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Deploy to EC2 instance
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: vendix-backend
        IMAGE_TAG: ${{ github.sha }}
        EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        SSH_KEY: ${{ secrets.VENDIX_SSH_PRIVATE_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        echo "🚀 Deploying to EC2 instance: $EC2_INSTANCE_ID"

        # Get EC2 instance public IP
        EC2_PUBLIC_IP=$(aws ec2 describe-instances --instance-ids $EC2_INSTANCE_ID --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        echo "📍 EC2 Public IP: $EC2_PUBLIC_IP"

        # Save SSH key to file
        echo "$SSH_KEY" > /tmp/vendix-key.pem
        chmod 400 /tmp/vendix-key.pem

        # Wait for EC2 instance to be ready
        echo "⏳ Waiting for EC2 instance to be ready..."
        for i in {1..30}; do
          if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i /tmp/vendix-key.pem ec2-user@$EC2_PUBLIC_IP "echo 'EC2 is ready'" 2>/dev/null; then
            echo "✅ EC2 instance is ready!"
            break
          fi
          echo "⏳ Attempt $i/30: EC2 not ready yet, waiting 10 seconds..."
          sleep 10
        done

        # Deploy on EC2
        ssh -o StrictHostKeyChecking=no -i /tmp/vendix-key.pem ec2-user@$EC2_PUBLIC_IP << ENDSSH
          set -e
          echo "🔐 Logging into ECR..."
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region us-east-1
          aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY

          echo "💾 Checking disk space before cleanup..."
          df -h /

          echo "🧹 Cleaning up disk space before pull..."
          # Remove all stopped containers
          sudo docker container prune -f
          # Remove all unused images (not just dangling)
          sudo docker image prune -af
          # Remove all unused volumes
          sudo docker volume prune -f
          # Clean build cache
          sudo docker builder prune -af
          # Clean yum cache
          sudo yum clean all || true

          echo "💾 Disk space after cleanup:"
          df -h /

          echo "📦 Pulling latest Docker image..."
          sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "🔑 Fetching secrets from AWS Secrets Manager..."
          DATABASE_URL=\$(aws secretsmanager get-secret-value --secret-id vendix/production/database --query SecretString --output text | python3 -c "import sys, json; print(json.load(sys.stdin)['DATABASE_URL'])")
          JWT_SECRET=\$(aws secretsmanager get-secret-value --secret-id vendix/production/jwt --query SecretString --output text | python3 -c "import sys, json; print(json.load(sys.stdin)['JWT_SECRET'])")
          # Refresh-token HMAC key (lives beside JWT_SECRET). .get(...,'') is tolerant:
          # if the key is not yet in the secret, this is empty and the backend uses its
          # documented dev fallback (no deploy break). Add the key once and every future
          # deploy injects it automatically — mirrors how JWT_SECRET flows.
          REFRESH_TOKEN_HMAC_SECRET=\$(aws secretsmanager get-secret-value --secret-id vendix/production/jwt --query SecretString --output text | python3 -c "import sys, json; print(json.load(sys.stdin).get('REFRESH_TOKEN_HMAC_SECRET', ''))")
          EMAIL_PASSWORD=\$(aws secretsmanager get-secret-value --secret-id vendix/production/email --query SecretString --output text | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('EMAIL_PASSWORD', ''))")

          # Fetch app configuration secrets
          APP_SECRETS=\$(aws secretsmanager get-secret-value --secret-id vendix/production/app --query SecretString --output text)
          BASE_DOMAIN=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; print(json.load(sys.stdin).get('BASE_DOMAIN', 'vendix.com'))")
          FRONTEND_URL=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; print(json.load(sys.stdin).get('FRONTEND_URL', 'https://vendix.com'))")
          PORT=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; print(json.load(sys.stdin).get('PORT', '3000'))")
          NODE_ENV=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; print(json.load(sys.stdin).get('NODE_ENV', 'production'))")
          CORS_ORIGIN=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('CORS_ORIGIN', ''))")
          ADDITIONAL_CORS_ORIGINS=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('ADDITIONAL_CORS_ORIGINS', ''))")
          # Proxies propios delante del backend (nginx + CloudFront = 2 en prod).
          # .get(...,'') es tolerante: si la clave todavía no está en el secreto,
          # llega vacía y el backend cae a su default documentado de 1 (no rompe
          # el deploy). Agregar la clave una vez hace que todo deploy futuro la
          # inyecte solo.
          TRUST_PROXY_HOPS=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('TRUST_PROXY_HOPS', ''))")
          # Google Geocoding fallback (ecommerce/geocoding forward cascade).
          # .get(...,'') tolerante igual que TRUST_PROXY_HOPS: si la clave aún
          # no está en el secreto, llega vacía y el backend cae a su default
          # documentado (feature deshabilitada / cap 5000) sin romper el deploy.
          GOOGLE_GEOCODING_API_KEY=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('GOOGLE_GEOCODING_API_KEY', ''))")
          GOOGLE_GEOCODING_MONTHLY_CAP=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('GOOGLE_GEOCODING_MONTHLY_CAP', ''))")

          # Email reception P0: independent pilot flag, default disabled; no provisioning here.
          EMAIL_RECEPTION_ENABLED=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_ENABLED', 'false')).lower())")
          EMAIL_RECEPTION_STORE_ALLOWLIST=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_STORE_ALLOWLIST', '')))")
          EMAIL_RECEPTION_ENVIRONMENT=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_ENVIRONMENT', 'production')))")
          EMAIL_RECEPTION_DOMAIN=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_DOMAIN', 'recepcion.vendix.online')))")
          EMAIL_RECEPTION_AWS_REGION=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_AWS_REGION', 'us-east-1')))")
          EMAIL_RECEPTION_SQS_QUEUE_URL=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_SQS_QUEUE_URL', '')))")
          EMAIL_RECEPTION_SNS_TOPIC_ARN=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_SNS_TOPIC_ARN', '')))")
          EMAIL_RECEPTION_RAW_BUCKET=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_RAW_BUCKET', '')))")
          EMAIL_RECEPTION_RAW_PREFIX=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_RAW_PREFIX', 'raw/')))")
          EMAIL_RECEPTION_DIAN_STATUS_ENABLED=\$(echo "\$APP_SECRETS" | python3 -c "import sys, json; data=json.load(sys.stdin); print(str(data.get('EMAIL_RECEPTION_DIAN_STATUS_ENABLED', 'false')).lower())")
          # Retention cron is deliberately NOT installed: approve dry-run and P0.11 purge command first.

          echo "🔧 Ensuring Redis env vars are in /opt/vendix/.env..."
          sudo grep -q '^REDIS_HOST=' /opt/vendix/.env || echo 'REDIS_HOST=vendix-redis' | sudo tee -a /opt/vendix/.env > /dev/null
          sudo grep -q '^REDIS_PORT=' /opt/vendix/.env || echo 'REDIS_PORT=6379' | sudo tee -a /opt/vendix/.env > /dev/null

          echo "🌐 Ensuring vendix-net network exists..."
          sudo docker network inspect vendix-net >/dev/null 2>&1 || sudo docker network create vendix-net

          echo "🧬 Running Prisma migrations before app start..."
          # El gate que sigue a migrate deploy interroga la BASE
          # (information_schema), no el cliente Prisma. El cliente se genera
          # desde schema.prisma en build, así que siempre tiene los campos
          # nuevos: preguntarle si existen no puede detectar nada. Un migrate
          # deploy que no aplique su migración deja al cliente creyendo en
          # columnas que la base no tiene, y eso sale como ColumnNotFound (HTTP
          # 500) en la primera escritura, con el deploy ya marcado success.
          # Ver apps/backend/prisma/assert-schema-columns.js.
          #
          # NO auto-resolver migraciones fallidas aquí. Un 'migrate resolve
          # --rolled-back' automático le declara a Prisma que la migración nunca
          # corrió y re-ejecuta TODO su SQL: para una migración aditiva es inocuo,
          # pero una que mute filas (INSERT/UPDATE/DELETE) se aplicaría dos veces
          # sobre producción sin que nadie mire. El P3009 es el freno que fuerza
          # esa mirada humana — dejarlo frenar es la conducta correcta.
          #
          # Recuperación manual cuando este paso falla con P3009/P3018:
          #   1. Verificar qué se aplicó de verdad, no asumirlo:
          #      SELECT migration_name, finished_at, rolled_back_at, applied_steps_count
          #        FROM _prisma_migrations WHERE finished_at IS NULL;
          #      y confirmar en information_schema/pg_constraint si los objetos existen.
          #   2. applied_steps_count = 0 y objetos ausentes -> nada se aplicó:
          #      corregir el SQL y  prisma migrate resolve --rolled-back <nombre>
          #   3. Aplicación parcial -> completar a mano de forma idempotente y
          #      prisma migrate resolve --applied <nombre>. NUNCA rolled-back aquí.
          sudo docker run --rm \
            --memory=768m \
            --network=host \
            --env-file /opt/vendix/.env \
            -e DATABASE_URL="\$DATABASE_URL" \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            sh -c "npx prisma migrate deploy && node prisma/assert-schema-columns.js"
          echo "✅ Migrations and database schema gate completed!"

          echo "🗄️  Ensuring vendix-redis container is running..."
          if ! sudo docker ps --filter name=^/vendix-redis$ --filter status=running -q | grep -q .; then
            sudo docker rm -f vendix-redis 2>/dev/null || true
            # maxmemory: OOM-protection ceiling for Redis on this SHARED t3.medium (4 GiB nameplate)
            # host that also runs vendix-backend (~1.5-2 GiB) + nginx + OS. allkeys-lru evicts cold
            # keys instead of the default 'noeviction' (which rejects writes and can OOM the box).
            # Size to ~50-60% of AVAILABLE RAM: re-confirm with 'free -m' and adjust if backend is smaller.
            sudo docker run -d --name vendix-redis \\
              --network vendix-net \\
              --restart unless-stopped \\
              -v vendix-redis-data:/data \\
              redis:7-alpine redis-server --appendonly yes --save 60 1000 \\
              --maxmemory 1gb --maxmemory-policy allkeys-lru
          else
            # Already running: the guard above never recreates a live container (to
            # preserve uptime/data), so a Redis started before this ceiling existed
            # would keep 'noeviction' + maxmemory 0. Reconcile in place — no downtime,
            # data preserved — so the OOM protection actually applies on every deploy.
            # CONFIG REWRITE persists it to the container's redis.conf.
            echo "♻️  vendix-redis already running — reconciling memory ceiling in place..."
            sudo docker exec vendix-redis redis-cli CONFIG SET maxmemory 1gb || true
            sudo docker exec vendix-redis redis-cli CONFIG SET maxmemory-policy allkeys-lru || true
            sudo docker exec vendix-redis redis-cli CONFIG REWRITE || true
          fi

          # DEPLOY BLUE/GREEN (patron estandar de NGINX en un solo host)
          #
          # nginx enruta la API por 'upstream vendix_api', definido en su propio
          # archivo (/etc/nginx/conf.d/vendix-upstream.conf) con un unico server:
          # el puerto del slot activo. Dos slots fijos de API:
          #   vendix-backend-blue  -> 127.0.0.1:3001
          #   vendix-backend-green -> 127.0.0.1:3002
          # (3000 = contenedor legado 'vendix-backend', solo en la transicion).
          # El puerto INTERNO del contenedor es siempre 3000: PORT no cambia
          # porque el puente Vexi (internal-http.ts) llama a 127.0.0.1:PORT.
          #
          # Secuencia: arrancar el slot inactivo, validarlo por health, conmutar
          # nginx con reload (graceful), verificar el health publico, drenar y
          # solo entonces detener el slot viejo. Si algo falla antes de conmutar,
          # el slot activo nunca dejo de servir.
          #
          # TODAS las variables y sustituciones de este bloque van con barra
          # invertida: el heredoc es SIN comillas y lo expande el runner de
          # GitHub; un signo de dolar sin escapar nunca llega al EC2.

          UPSTREAM_FILE=/etc/nginx/conf.d/vendix-upstream.conf
          NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          # (0) Preflight de memoria: la API nueva convive un rato con la vieja
          # (y con el worker de 2560m) en un host de ~7.8 GB. Sin margen, abortar
          # SIN tocar nada.
          echo "🧮 Preflight: checking available memory..."
          free -m
          AVAIL_MB=\$(free -m | awk '/^Mem:/ {print \$7}')
          if [ "\${AVAIL_MB:-0}" -lt 2500 ]; then
            echo "❌ Only \${AVAIL_MB:-0} MB available (need >= 2500 MB to run two APIs side by side). Aborting before touching any container."
            exit 1
          fi
          echo "✅ \$AVAIL_MB MB available"

          # QUI-674 — SEPARACION API / WORKER
          #
          # La API y los 11 workers de BullMQ (mas todos los @Cron) compartian un
          # solo proceso Node, asi que un job CPU-bound congelaba el event loop y
          # nginx devolvia 504 en rutas triviales. Se despliegan como DOS
          # contenedores desde LA MISMA imagen y con el MISMO comando: lo unico
          # que cambia es VENDIX_PROCESS_ROLE.
          #
          # El rol viaja SIEMPRE por -e, que gana sobre --env-file, para que un
          # valor rancio en /opt/vendix/.env nunca decida que hace un contenedor.
          #
          # start_api <nombre> <puerto_host> <rol> <imagen>
          # Es una funcion y no bloques copiados para que el camino blue/green y
          # el camino legado no se separen en sus -e. En slots la API solo se
          # publica en loopback (127.0.0.1:<puerto>:3000); el camino legado
          # (puerto 3000) conserva la publicacion historica 3000:3000.
          start_api() {
            local name="\$1" host_port="\$2" role="\$3" image="\$4" publish
            if [ "\$host_port" = "3000" ]; then
              publish="3000:3000"
            else
              publish="127.0.0.1:\$host_port:\${PORT:-3000}"
            fi
            sudo docker run -d \\
              --name "\$name" \\
              --network vendix-net \\
              --restart unless-stopped \\
              -p "\$publish" \\
              --env-file /opt/vendix/.env \\
              -e VENDIX_PROCESS_ROLE="\$role" \\
              -e REFRESH_TOKEN_HMAC_SECRET="\$REFRESH_TOKEN_HMAC_SECRET" \\
              -e BASE_DOMAIN="\$BASE_DOMAIN" \\
              -e FRONTEND_URL="\$FRONTEND_URL" \\
              -e PORT="\$PORT" \\
              -e NODE_ENV="\$NODE_ENV" \\
              -e CORS_ORIGIN="\$CORS_ORIGIN" \\
              -e ADDITIONAL_CORS_ORIGINS="\$ADDITIONAL_CORS_ORIGINS" \\
              -e TRUST_PROXY_HOPS="\$TRUST_PROXY_HOPS" \\
              -e GOOGLE_GEOCODING_API_KEY="\$GOOGLE_GEOCODING_API_KEY" \\
              -e GOOGLE_GEOCODING_MONTHLY_CAP="\$GOOGLE_GEOCODING_MONTHLY_CAP" \\
              -e EMAIL_RECEPTION_ENABLED="\$EMAIL_RECEPTION_ENABLED" \\
              -e EMAIL_RECEPTION_STORE_ALLOWLIST="\$EMAIL_RECEPTION_STORE_ALLOWLIST" \\
              -e EMAIL_RECEPTION_ENVIRONMENT="\$EMAIL_RECEPTION_ENVIRONMENT" \\
              -e EMAIL_RECEPTION_DOMAIN="\$EMAIL_RECEPTION_DOMAIN" \\
              -e EMAIL_RECEPTION_AWS_REGION="\$EMAIL_RECEPTION_AWS_REGION" \\
              -e EMAIL_RECEPTION_SQS_QUEUE_URL="\$EMAIL_RECEPTION_SQS_QUEUE_URL" \\
              -e EMAIL_RECEPTION_SNS_TOPIC_ARN="\$EMAIL_RECEPTION_SNS_TOPIC_ARN" \\
              -e EMAIL_RECEPTION_RAW_BUCKET="\$EMAIL_RECEPTION_RAW_BUCKET" \\
              -e EMAIL_RECEPTION_RAW_PREFIX="\$EMAIL_RECEPTION_RAW_PREFIX" \\
              -e EMAIL_RECEPTION_DIAN_STATUS_ENABLED="\$EMAIL_RECEPTION_DIAN_STATUS_ENABLED" \\
              "\$image"
          }

          # wait_api_ready <puerto_host> <nombre>: hasta 120 s esperando health 200
          # Y el ancla API_READY en los logs (misma idea que WORKER_READY).
          wait_api_ready() {
            local port="\$1" name="\$2"
            local end=\$((SECONDS + 120))
            while [ \$SECONDS -lt \$end ]; do
              if curl -fsS -o /dev/null --max-time 5 "http://127.0.0.1:\$port/api/health" 2>/dev/null \
                && sudo docker logs "\$name" 2>&1 | grep -q "API_READY pid="; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          # Camino legado (sin vendix-upstream.conf): comportamiento historico,
          # stop/rm de vendix-backend y arranque en 3000. Solo para no romper un
          # host que aun no tenga el upstream de nginx.
          legacy_deploy_api() {
            echo "🛑 Stopping legacy vendix-backend..."
            sudo docker stop vendix-backend || true
            sudo docker rm vendix-backend || true
            echo "🚀 Starting vendix-backend on 3000 (role: api)..."
            start_api vendix-backend 3000 api "\$NEW_IMAGE"
            if wait_api_ready 3000 vendix-backend; then
              echo "✅ Legacy API is healthy"
            else
              echo "❌ Legacy API did NOT become healthy — logs:"
              sudo docker logs vendix-backend --tail 80 || true
              exit 1
            fi
          }

          # (a) Slot activo = el puerto que figura en el upstream de nginx.
          ACTIVE_NAME=""
          if sudo test -f "\$UPSTREAM_FILE"; then
            ACTIVE_PORT=\$(sudo cat "\$UPSTREAM_FILE" | sed -nE 's/.*server[[:space:]]+127\.0\.0\.1:([0-9]+).*/\1/p' | head -n1)
            case "\$ACTIVE_PORT" in
              3001) ACTIVE_NAME=vendix-backend-blue ;;
              3002) ACTIVE_NAME=vendix-backend-green ;;
              3000) ACTIVE_NAME=vendix-backend ;;
              *) echo "⚠️  Could not read a known port from \$UPSTREAM_FILE (got '\$ACTIVE_PORT'); deploying to blue." ;;
            esac
            if [ "\$ACTIVE_NAME" = "vendix-backend-blue" ]; then
              TARGET_NAME=vendix-backend-green
              TARGET_PORT=3002
            else
              TARGET_NAME=vendix-backend-blue
              TARGET_PORT=3001
            fi
            echo "🔀 Active: \${ACTIVE_NAME:-none} (port \${ACTIVE_PORT:-n/a}) -> deploying to \$TARGET_NAME on \$TARGET_PORT"

            # (b) Limpiar restos del slot destino y arrancarlo con la imagen nueva.
            sudo docker rm -f "\$TARGET_NAME" 2>/dev/null || true
            echo "🚀 Starting \$TARGET_NAME (role: api) on 127.0.0.1:\$TARGET_PORT..."
            start_api "\$TARGET_NAME" "\$TARGET_PORT" api "\$NEW_IMAGE"

            # (c) La API nueva es su propio smoke test. Si no queda sana, nunca se
            # conmuta: el slot activo sigue sirviendo.
            echo "⏳ Waiting for \$TARGET_NAME to be healthy (up to 120s)..."
            if wait_api_ready "\$TARGET_PORT" "\$TARGET_NAME"; then
              echo "✅ \$TARGET_NAME is healthy"
            else
              echo "❌ \$TARGET_NAME did NOT become healthy — logs:"
              sudo docker logs --tail 80 "\$TARGET_NAME" || true
              sudo docker rm -f "\$TARGET_NAME" || true
              echo "❌ Aborting. The active API (\${ACTIVE_NAME:-none}) keeps serving; nginx was not touched."
              exit 1
            fi

            # (d) Conmutar nginx: copia del upstream, escribir el nuevo, nginx -t y
            # reload graceful (los workers viejos terminan sus peticiones).
            UPSTREAM_BAK=\$(mktemp)
            sudo cp -p "\$UPSTREAM_FILE" "\$UPSTREAM_BAK"
            echo "upstream vendix_api { server 127.0.0.1:\$TARGET_PORT; }" | sudo tee "\$UPSTREAM_FILE" > /dev/null
            if ! { sudo nginx -t && sudo nginx -s reload; }; then
              echo "❌ nginx test/reload failed — restoring previous upstream."
              sudo cp -p "\$UPSTREAM_BAK" "\$UPSTREAM_FILE"
              sudo nginx -s reload || true
              sudo docker rm -f "\$TARGET_NAME" || true
              exit 1
            fi
            echo "🔁 nginx now points to \$TARGET_NAME (127.0.0.1:\$TARGET_PORT)"

            # (e) Health publico por la ruta real (TLS + nginx + upstream nuevo).
            PUBLIC_OK=0
            for ATTEMPT in 1 2 3; do
              if curl -fsS -o /dev/null --max-time 10 https://api.vendix.online/api/health; then
                PUBLIC_OK=1
                break
              fi
              echo "⚠️  Public health attempt \$ATTEMPT/3 failed"
              sleep 3
            done
            if [ "\$PUBLIC_OK" != "1" ]; then
              echo "❌ Public health check failed after switch — rolling nginx back to the previous upstream."
              sudo cp -p "\$UPSTREAM_BAK" "\$UPSTREAM_FILE"
              sudo nginx -t && sudo nginx -s reload
              sudo docker rm -f "\$TARGET_NAME" || true
              echo "↩️  Previous API (\${ACTIVE_NAME:-none}) is still running and serving."
              exit 1
            fi
            echo "✅ Public health OK on \$TARGET_NAME"

            # (f) Drenaje y retiro del slot viejo. Las conexiones SSE viejas quedan
            # sin eventos nuevos en esta ventana (fan-out en memoria). La API no
            # maneja SIGTERM, por eso el -t 30 es un tope, no un cierre ordenado.
            # El slot viejo queda DETENIDO, no borrado: el container prune del
            # proximo deploy lo limpia.
            echo "⏳ Draining old API for 30s..."
            sleep 30
            if [ -n "\$ACTIVE_NAME" ]; then
              echo "🛑 Stopping old API (\$ACTIVE_NAME)..."
              sudo docker stop -t 30 "\$ACTIVE_NAME" || true
            fi
            ACTIVE_NAME="\$TARGET_NAME"
          else
            echo "⚠️  \$UPSTREAM_FILE not found — falling back to the legacy single-container deploy on port 3000 (NOT zero-downtime)."
            legacy_deploy_api
            ACTIVE_NAME=vendix-backend
          fi

          # (g) Recien con la API nueva sirviendo: seeds y worker EN SERIE.
          # Los seeds corren aqui (y no antes) para no sumar 512m a la ventana en
          # que conviven dos APIs.
          echo "🌱 Running production seeds in isolated container..."
          sudo docker run --rm \
            --memory=512m \
            --network=host \
            --env-file /opt/vendix/.env \
            -e DATABASE_URL="\$DATABASE_URL" \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            sh -c "npx --yes tsx prisma/seed-production.ts"
          echo "✅ Seeds completed!"

          # --- Contenedor worker: reemplazo en SERIE (nunca dos a la vez) ---
          #
          # Dos workers simultaneos duplicarian los @Cron (no hay lock
          # distribuido), por eso el viejo se detiene ANTES de arrancar el nuevo.
          # La imagen del worker actual se captura antes de borrarlo: si el nuevo
          # no queda arriba, se relanza el anterior.
          #
          # Presupuesto de memoria del worker — MEDIDO en produccion, no estimado.
          #
          # El worker NO es un proceso ligero: carga el 'AppModule' INTEGRO (el
          # mismo grafo que la API, cliente Prisma incluido), asi que su coste de
          # arranque es casi el de la API. Los 768m/640 originales se eligieron
          # como "punto de partida medible" y resultaron insuficientes por un
          # factor de ~3:
          #
          #   cap 640  -> muere a 639 MB   (FATAL ERROR: Reached heap limit)
          #   cap 1024 -> muere a 1022 MB, con Mark-Compact liberando 0.2 MB
          #               (1022.4 -> 1022.2), a mitad del InstanceLoader
          #
          # Es decir: no se estabiliza por debajo del GiB. El docker-compose de
          # desarrollo ya lo documentaba para el mismo grafo bajo node:24-alpine
          # ('--max-old-space-size=2048' en la API, 1024 en el worker con 1536m
          # de contenedor).
          #
          # Estos valores asumen un host de ~7.8 GiB. Si se vuelve a bajar el tipo
          # de instancia, hay que bajar estos numeros o el worker no arrancara
          # jamas (crash-loop permanente; el gate de abajo lo detecta).
          #
          # --memory-swap deja 512m de colchon sobre el limite de RAM para
          # absorber un pico puntual sin que el cgroup mate el proceso.
          #
          # --stop-timeout 60: en el cierre ordenado BullMQ espera a que termine
          # el job en vuelo. Sin esto docker manda SIGKILL a los 10 s y el lock
          # queda huerfano — que con maxStalledCount:0 significa job fallido.
          #
          # start_worker <imagen>
          start_worker() {
            sudo docker run -d \\
              --name vendix-backend-worker \\
              --network vendix-net \\
              --restart unless-stopped \\
              --memory=2560m \\
              --memory-swap=3072m \\
              --stop-timeout 60 \\
              --env-file /opt/vendix/.env \\
              -e VENDIX_PROCESS_ROLE=worker \\
              -e NODE_OPTIONS="--max-old-space-size=2048" \\
              -e REFRESH_TOKEN_HMAC_SECRET="\$REFRESH_TOKEN_HMAC_SECRET" \\
              -e BASE_DOMAIN="\$BASE_DOMAIN" \\
              -e FRONTEND_URL="\$FRONTEND_URL" \\
              -e NODE_ENV="\$NODE_ENV" \\
              -e GOOGLE_GEOCODING_API_KEY="\$GOOGLE_GEOCODING_API_KEY" \\
              -e GOOGLE_GEOCODING_MONTHLY_CAP="\$GOOGLE_GEOCODING_MONTHLY_CAP" \\
              -e EMAIL_RECEPTION_ENABLED="\$EMAIL_RECEPTION_ENABLED" \\
              -e EMAIL_RECEPTION_STORE_ALLOWLIST="\$EMAIL_RECEPTION_STORE_ALLOWLIST" \\
              -e EMAIL_RECEPTION_ENVIRONMENT="\$EMAIL_RECEPTION_ENVIRONMENT" \\
              -e EMAIL_RECEPTION_DOMAIN="\$EMAIL_RECEPTION_DOMAIN" \\
              -e EMAIL_RECEPTION_AWS_REGION="\$EMAIL_RECEPTION_AWS_REGION" \\
              -e EMAIL_RECEPTION_SQS_QUEUE_URL="\$EMAIL_RECEPTION_SQS_QUEUE_URL" \\
              -e EMAIL_RECEPTION_SNS_TOPIC_ARN="\$EMAIL_RECEPTION_SNS_TOPIC_ARN" \\
              -e EMAIL_RECEPTION_RAW_BUCKET="\$EMAIL_RECEPTION_RAW_BUCKET" \\
              -e EMAIL_RECEPTION_RAW_PREFIX="\$EMAIL_RECEPTION_RAW_PREFIX" \\
              -e EMAIL_RECEPTION_DIAN_STATUS_ENABLED="\$EMAIL_RECEPTION_DIAN_STATUS_ENABLED" \\
              "\$1"
          }

          # wait_worker_ready: gate robusto, hasta 90 s por el ancla WORKER_READY.
          # Se llama dentro de un if, asi que set -e no aborta el script a mitad
          # del gate.
          wait_worker_ready() {
            local end=\$((SECONDS + 90))
            local restarts
            while [ \$SECONDS -lt \$end ]; do
              if sudo docker logs vendix-backend-worker 2>&1 | grep -q "WORKER_READY pid="; then
                return 0
              fi
              # Si el contenedor ya reinicio (OOM o crash temprano antes del
              # ancla), abortamos el loop: no se va a estabilizar solo.
              restarts=\$(sudo docker inspect -f '{{.State.RestartCount}}' vendix-backend-worker 2>/dev/null || echo 0)
              if [ "\$restarts" -gt 0 ]; then
                echo "⚠️  Worker restarted (\$restarts times) before emitting WORKER_READY anchor."
                return 1
              fi
              sleep 2
            done
            return 1
          }

          PREV_WORKER_IMAGE=\$(sudo docker inspect -f '{{.Config.Image}}' vendix-backend-worker 2>/dev/null || true)
          echo "⚙️  Replacing worker (previous image: \${PREV_WORKER_IMAGE:-none})..."
          sudo docker stop vendix-backend-worker || true
          sudo docker rm vendix-backend-worker || true

          WORKER_UP=0
          if start_worker "\$NEW_IMAGE"; then
            if wait_worker_ready; then
              WORKER_UP=1
              echo "✅ Worker container is running and ready (WORKER_READY anchor found)"
              sudo docker logs vendix-backend-worker --tail 20 || true
            else
              echo "⚠️  Worker container is NOT healthy — logs:"
              sudo docker logs vendix-backend-worker --tail 50 || true
            fi
          else
            echo "⚠️  Could not start the worker container."
          fi

          if [ "\$WORKER_UP" != "1" ]; then
            # Sin worker nadie ejecutaria cobros, recordatorios, provisiones ni
            # reintentos, y en silencio. Se relanza el worker anterior y el deploy
            # termina en rojo. NO se toca la API (no hay fallback a rol 'all':
            # duplicaria los @Cron al convivir con el worker).
            sudo docker rm -f vendix-backend-worker || true
            if [ -n "\$PREV_WORKER_IMAGE" ]; then
              echo "↩️  Relaunching previous worker image: \$PREV_WORKER_IMAGE"
              start_worker "\$PREV_WORKER_IMAGE" || echo "❌ Could not relaunch the previous worker."
            else
              echo "❌ There was no previous worker image to relaunch."
            fi
            echo "❌ New worker did not come up — failing the deploy (API \$ACTIVE_NAME keeps serving)."
            exit 1
          fi

          echo "🧵 Split API/worker activo: la API (\$ACTIVE_NAME) corre sin workers ni @Cron."
          sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

          echo "🧹 Cleaning up old images..."
          sudo docker image prune -f

          echo "✅ Deployment completed!"
        ENDSSH

        echo "🎉 Backend deployment to EC2 completed successfully!"
        echo "🌐 Backend URL: https://api.vendix.online (API bound to 127.0.0.1 on the active blue/green slot)"

    # CloudFront (E1I27OYFJX7VYJ) enruta sitemap/robots/manifest/pwa de vendix.online
    # al backend y los guarda hasta 1 h. El deploy del frontend invalida /* en
    # paralelo, sin orden respecto al cambio de slot: puede volver a guardar el
    # XML viejo. Se invalida aqui, despues del switch. Corre aunque el worker
    # falle (la API ya quedo en el slot nuevo); si el switch se revirtio,
    # invalidar es inocuo.
    - name: Invalidate CloudFront backend-served paths
      if: ${{ !cancelled() }}
      run: |
        aws cloudfront create-invalidation \
          --distribution-id E1I27OYFJX7VYJ \
          --paths "/sitemap.xml" "/robots.txt" "/manifest.webmanifest" "/pwa/*"
