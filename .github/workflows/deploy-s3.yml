name: Deploy Frontend to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  AWS_REGION: us-east-1
  S3_BUCKET: vendix-online-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E1I27OYFJX7VYJ

jobs:
  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install -ws

      - name: Build frontend for production
        working-directory: apps/frontend
        run: npm run build:prod

      # SEO-TECH-02: HTML comercial prerenderizado de la portada de vendix.online.
      # Sale de un build aparte (dist/marketing-preview) y solo lo sirve la CloudFront
      # Function en vendix.online/ (spa-rewrite.js → /marketing/index.html).
      # check-marketing-preview.cjs exige H1, enlaces, index/canonical/OG y que la
      # shell compartida dist/vendix/browser/index.html siga neutra.
      # Si este build falla (p. ej. la API de planes no responde), el deploy sigue y
      # en S3 queda el /marketing/index.html anterior (la sincronización no lo borra).
      - name: Build marketing HTML (SEO-TECH-02)
        id: marketing_html
        continue-on-error: true
        working-directory: apps/frontend
        run: |
          npm run build:marketing-preview
          node scripts/check-marketing-preview.cjs

      # SEO-TECH-04: copia de la shell con noindex en el HTML, para las rutas que no deben
      # indexarse (spa-rewrite.js → /noindex/index.html). Si falla, el deploy se detiene antes
      # de subir nada: la función ya publicada depende de este objeto.
      - name: Build noindex shell (SEO-TECH-04)
        working-directory: apps/frontend
        run: |
          node scripts/make-noindex-shell.test.cjs
          node scripts/make-noindex-shell.cjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Sync browser directory with all assets
          aws s3 sync apps/frontend/dist/vendix/browser/ \
            s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "marketing/*" \
            --exclude "noindex/*"
          
          # Upload index.html with no-cache (for SPA routing)
          aws s3 cp apps/frontend/dist/vendix/browser/index.html \
            s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html"

          # SEO-TECH-04: shell noindex (mismo HTML, robots noindex), sin caché como index.html.
          aws s3 cp apps/frontend/dist/noindex-shell/index.html \
            s3://${{ env.S3_BUCKET }}/noindex/index.html \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html"

          # SEO-TECH-02: assets del build comercial (con hash, sin borrar nada) y su HTML,
          # que solo se sirve en vendix.online/. Sube después de la shell neutra.
          if [ "${{ steps.marketing_html.outcome }}" = "success" ]; then
          aws s3 sync apps/frontend/dist/marketing-preview/browser/ \
            s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 cp apps/frontend/dist/marketing-preview/browser/index.html \
            s3://${{ env.S3_BUCKET }}/marketing/index.html \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html"
          else
            echo "::warning::HTML comercial no generado; se conserva el /marketing/index.html anterior."
          fi

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"