services:
  db:
    image: pgvector/pgvector:0.8.2-pg15
    container_name: vendix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendix_db
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - vendix_pgdata:/var/lib/postgresql/data
    networks:
      - vendix_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: vendix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vendix_redis_data:/data
    networks:
      - vendix_net
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: vendix_backend
    restart: unless-stopped
    # Sin límite, el backend crecía libre (~2.3 GB observados) y empujaba a la
    # VM al OOM global, cuya víctima siempre acababa siendo `ng serve` por RSS.
    mem_limit: 2560m
    memswap_limit: 3g
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgres://username:password@db:5432/vendix_db?schema=public
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=1536"
      CHOKIDAR_USEPOLLING: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # QUI-489: en dev el límite de 10 intentos de login estorba al probar
      # flujos de auth. Este compose es sólo de desarrollo (NODE_ENV arriba lo
      # fija), así que el 30 vive acá y prod queda con el default seguro de 10.
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-30}
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    networks:
      - vendix_net
    command: sh -c "npx prisma generate && npm run start:dev"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: vendix_frontend
    restart: unless-stopped
    # Presupuesto del contenedor en build en frío, medido en dmesg:
    #   ng serve (heap V8)  ~2.5 GB
    #   esbuild (binario Go) ~1.5 GB   <-- NO lo gobierna NODE_OPTIONS
    #   overhead de Node     ~0.3 GB
    # Total ~4.3 GB, por eso 4g moría con CONSTRAINT_MEMCG. Requiere VM de
    # colima con 10 GB (5.5g frontend + 2.5g backend + resto).
    mem_limit: 5632m
    memswap_limit: 6656m
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://api.vendix.com
      # Ojo: este límite lo hereda también el *worker* de compilación de
      # Angular, no sólo el proceso de ng serve. Con 2048 el worker moría con
      # "Worker terminated due to reaching memory limit: JS heap out of memory"
      # y el compiler-plugin quedaba con compilation=null, lo que se manifiesta
      # como un críptico assert(compilation) en el ciclo siguiente.
      # 3072 le alcanza y sigue por debajo del 4096 original que dejaba al GC
      # crecer hasta reventar la VM.
      - NODE_OPTIONS=--max-old-space-size=3072
      - CHOKIDAR_USEPOLLING="true"
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    networks:
      - vendix_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: vendix_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl/certs:/etc/ssl/certs:ro
      - ./ssl/private:/etc/ssl/private:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vendix_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Docker cleanup - limpieza automática cada 24h
  docker-cleanup:
    image: docker:cli
    container_name: vendix_cleanup
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Cleanup service started"
        while true; do
          sleep 86400
          echo "Running cleanup at $$(date)"
          docker image prune -af --filter "until=168h"
          docker container prune -f --filter "until=24h"
          docker volume prune -f --filter "label!=keep"
          echo "Cleanup done"
        done
    networks:
      - vendix_net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

volumes:
  vendix_pgdata:
  vendix_redis_data:

networks:
  vendix_net:
    driver: bridge
