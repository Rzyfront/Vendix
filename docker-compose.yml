services:
  db:
    image: pgvector/pgvector:0.8.2-pg15
    container_name: vendix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendix_db
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - vendix_pgdata:/var/lib/postgresql/data
    networks:
      - vendix_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: vendix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vendix_redis_data:/data
    networks:
      - vendix_net
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: vendix_backend
    restart: unless-stopped
    # Sin límite, el backend crecía libre (~2.3 GB observados) y empujaba a la
    # VM al OOM global, cuya víctima siempre acababa siendo `ng serve` por RSS.
    mem_limit: 2560m
    memswap_limit: 3g
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgres://username:password@db:5432/vendix_db?schema=public
      NODE_ENV: development
      # node:24-alpine (subido desde node:20-alpine por EOL de Node 20, 2026-04-30):
      # el mismo grafo de rutas/DI necesita más heap para bootear sin OOM que en
      # Node 20 — 1536 chocaba justo al terminar RouterExplorer.
      NODE_OPTIONS: "--max-old-space-size=2048"
      CHOKIDAR_USEPOLLING: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # QUI-489: en dev el límite por IP estorba al probar flujos de auth. Este
      # compose es sólo de desarrollo (NODE_ENV arriba lo fija), así que el 30
      # vive acá. Ojo: desde el arreglo del rate limit esta variable gobierna
      # la cubeta por IP REAL (default 50, red anti-inundación); el freno de
      # fuerza bruta por cuenta es LOGIN_RATE_LIMIT_MAX_PER_ACCOUNT (10).
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-30}
      # Saltos de proxy propios delante del backend, para que `req.ip` sea la
      # IP real del cliente y los rate limits dejen de compartir una sola
      # cubeta global. Acá la cadena es navegador -> nginx -> backend, o sea 1.
      # En producción hay CloudFront delante de nginx: ese entorno debe fijar
      # TRUST_PROXY_HOPS=2 en /opt/vendix/.env. Verificable con
      # `curl .../api/health` -> campo `client_ip`. Ver client-ip.util.ts.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    networks:
      - vendix_net
    command: sh -c "npx prisma generate && npm run start:dev"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Proceso worker: MISMA imagen, MISMO comando, distinto VENDIX_PROCESS_ROLE.
  #
  # QUI-674: los 11 workers de BullMQ y todos los @Cron compartían el event loop
  # de la API, así que un job CPU-bound (firmar el set de pruebas DIAN) congelaba
  # el backend entero. Con el rol separado, un worker bloqueado ya no puede
  # tumbar la API porque no comparte su event loop.
  #
  # NO arranca por defecto: pertenece al perfil `split`, así que
  # `docker compose up -d` sigue levantando el stack de siempre —un solo backend
  # con todo dentro— y el desarrollo cotidiano no cambia. Para reproducir la
  # topología de producción:
  #
  #   docker compose --profile split up -d backend-worker
  #   # y en el contenedor `backend`, VENDIX_PROCESS_ROLE=api
  #
  # La cola vive en el contenedor `redis`, que ya es compartido, así que el
  # productor (API) y el consumidor (worker) se encuentran sin más cableado.
  backend-worker:
    profiles: ["split"]
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: vendix_backend_worker
    restart: unless-stopped
    # Presupuesto menor que el de la API: no sirve HTTP ni sostiene SSE, pero
    # carga el MISMO grafo de módulos (cliente Prisma incluido), que es el grueso
    # del heap en reposo.
    mem_limit: 1536m
    memswap_limit: 2g
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgres://username:password@db:5432/vendix_db?schema=public
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=1024"
      CHOKIDAR_USEPOLLING: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VENDIX_PROCESS_ROLE: worker
    depends_on:
      - db
      - redis
    # Sin `ports`: no hay servidor HTTP que exponer. Es la comprobación más
    # barata de que el modo worker no abrió un puerto por accidente.
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    networks:
      - vendix_net
    command: sh -c "npx prisma generate && npm run start:dev"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # RESPALDO, no arranca por defecto. El frontend de desarrollo corre NATIVO
  # en macOS: `npm run dev:fe` (ver README, "Arranque local").
  #
  # El motivo es memoria. Medido el 2026-08-30 con este mismo servicio arriba:
  # el contenedor sostenia 5.4 GiB de su cgroup de 5.5 GiB (98.2 %) y el host
  # se quedaba con 903 MB libres de sus 16 GB. Fuera del cgroup, el heap de V8
  # crece contra la RAM fisica en vez de morir con CONSTRAINT_MEMCG, y el watch
  # usa FSEvents en vez del `--poll 5000` que exige VirtioFS.
  #
  # Para volver a levantarlo (por ejemplo, si falla el camino nativo):
  #   docker compose --profile docker-fe up -d frontend
  # Ojo: entonces hay que APAGAR el `ng serve` nativo — ambos publican el 4200.
  frontend:
    profiles: ["docker-fe"]
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: vendix_frontend
    restart: unless-stopped
    # Presupuesto del contenedor en build en frío, medido en dmesg:
    #   ng serve (heap V8)  ~3.5 GB     (medido 2026-08-20 16:09, SIGKILL pid 469408)
    #   esbuild (binario Go) ~1.5 GB   <-- NO lo gobierna NODE_OPTIONS
    #   overhead de Node     ~0.3 GB
    # Total ~5.3 GB, rozando el cgroup → SIGKILL con CONSTRAINT_MEMCG.
    # Subir mem_limit requiere VM con más RAM (hoy 10 GB, 1.6 GB libres).
    # memswap +512 MB da aire para picos sin tocar el presupuesto VM.
    mem_limit: 5632m
    memswap_limit: 7168m
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://api.vendix.com
      # Ojo: este límite lo hereda también el *worker* de compilación de
      # Angular, no sólo el proceso de ng serve. Con 2048 el worker moría con
      # "Worker terminated due to reaching memory limit: JS heap out of memory"
      # y el compiler-plugin quedaba con compilation=null, lo que se manifiesta
      # como un críptico assert(compilation) en el ciclo siguiente.
      # 3072 dejaba a V8 holgado y al cgroup sin margen; 2560 (~-500 MiB en V8
      # heap observado) deja al cgroup con ~1 GB libre y mantiene al worker
      # por encima del umbral crítico de 2048. Medido estable tras fix del
      # 2026-08-20 (SIGKILL por anon-rss=3.47 GB con 3072).
      - NODE_OPTIONS=--max-old-space-size=2560
      - CHOKIDAR_USEPOLLING="true"
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    networks:
      - vendix_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: vendix_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl/certs:/etc/ssl/certs:ro
      - ./ssl/private:/etc/ssl/private:ro
    # Sin `frontend`: ese servicio vive ahora en el perfil `docker-fe` y no
    # arranca por defecto. Declararlo aqui haria fallar `docker compose up`.
    depends_on:
      - backend
    networks:
      - vendix_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Docker cleanup - limpieza automática cada 24h
  docker-cleanup:
    image: docker:cli
    container_name: vendix_cleanup
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Cleanup service started"
        while true; do
          sleep 86400
          echo "Running cleanup at $$(date)"
          docker image prune -af --filter "until=168h"
          docker container prune -f --filter "until=24h"
          docker volume prune -f --filter "label!=keep"
          echo "Cleanup done"
        done
    networks:
      - vendix_net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

volumes:
  vendix_pgdata:
  vendix_redis_data:

networks:
  vendix_net:
    driver: bridge
